---
# NOTE: unlike hosts/roles/tailscale, this doesn't install/join Tailscale -
# assumes it's already set up via the Mac App Store app or a prior manual
# step. Folding Tailscale join into this role is a reasonable next step
# once there's more than one Mac in the fleet to justify automating it.

- name: Tap additional Homebrew taps
  community.general.homebrew_tap:
    name: "{{ item }}"
  loop: "{{ baseline_taps }}"

- name: Install baseline formulae
  community.general.homebrew:
    name: "{{ baseline_brews }}"
    state: present

- name: Install baseline casks
  community.general.homebrew_cask:
    name: "{{ baseline_casks }}"
    state: present
