# Updates are proposed, never merged automatically. The cooldown holds a new release back for a week so a compromised or yanked release is usually
# caught before it arrives; security updates are exempt from it. npm and pip hold a major version for two weeks. GitHub does not support the
# semver-*-days keys for github-actions or docker, so do not add them there: majors of those wait a week. Ansible collections are not covered by Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: npm
    directory: /console
    schedule: {interval: weekly}
    cooldown: {default-days: 7, semver-major-days: 14}
  - package-ecosystem: docker
    directory: /console
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7, semver-major-days: 14}
