name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install linters
        run: pip install ansible-lint yamllint

      - name: Install required collections
        run: ansible-galaxy collection install -r hosts/requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint (hosts)
        run: ansible-lint hosts

      - name: ansible-lint (macos)
        run: ansible-lint macos
