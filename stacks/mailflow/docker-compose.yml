# MailFlow (https://mailflow.sh, AGPL-3.0): a self-hosted webmail client for IMAP accounts. Adapted from the project's
# docker-compose.ghcr.yml to sit behind Traefik: nginx serves plain HTTP on the shared proxy network and publishes nothing on the host.
# All four images are multi-architecture (amd64 and arm64), so this runs on an ARM VPS such as Oracle's Ampere A1.
#
# Setup: copy .env.example to .env and fill it in (see README.md), then `docker compose up -d` (or let Arcane deploy this directory).
---
services:
  frontend:
    image: ghcr.io/maathimself/mailflow-frontend:${MAILFLOW_VERSION:?pin a version in .env}
    container_name: mailflow-frontend
    restart: unless-stopped
    environment:
      # HTTP on port 80 only: Traefik terminates TLS.
      NGINX_TLS: "off"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailflow
      - proxynet   # Traefik reaches it as http://mailflow-frontend:80

  backend:
    image: ghcr.io/maathimself/mailflow-backend:${MAILFLOW_VERSION:?pin a version in .env}
    container_name: mailflow-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?}
      APP_URL: ${APP_URL:?}
      FRONTEND_URL: ${APP_URL:?}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      # Web Push (browser notifications). Generate the pair once: see README.md. VAPID_SUBJECT is a contact the push services see: an https URL or mailto:.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # One reverse proxy (Traefik) sits in front.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailflow

  postgres:
    image: postgres:16-alpine
    container_name: mailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailflow

volumes:
  postgres_data:
  redis_data:

networks:
  mailflow:
  proxynet:
    external: true
