[defaults]
roles_path = roles
# Filters shared by several roles (platform_version_compare and platform_version_matches: Debian-aware version ordering, see the platform layer).
filter_plugins = plugins/filter
# The fleet_routes lookup (routes from per-domain files in the fleet repo's config/routes/).
lookup_plugins = plugins/lookup
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[inventory]
# Plays target groups your taxonomy may not define; that is normal, not an error.
host_pattern_mismatch = ignore
