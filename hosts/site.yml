---
# Entry point for both reconcile.sh (scheduled, on every host) and Semaphore
# (on-demand / webhook-triggered). Keep this file boring - real logic lives
# in the roles.

- name: Fleet baseline + maintenance
  hosts: all
  become: true
  pre_tasks:
    # Automatic OS groups (os_linux, os_linux_debian, os_darwin, os_darwin_macosx, ...)
    # so vars/group/os_<...>.yml and plays can target by OS with no table entry.
    - name: Group by operating system
      ansible.builtin.group_by:
        key: "{{ item }}"
      loop:
        - "os_{{ ansible_system | lower }}"
        - "os_{{ ansible_system | lower }}_{{ ansible_distribution | lower | replace(' ', '_') }}"
      changed_when: false
      tags: [always]
  roles:
    - baseline
    - tailscale
    - sops
    - docker

# What else runs is decided by tag manifests (hosts/tags/<dimension>/<value>.yml,
# overridable and extendable in your fleet repo's config/tags/): each tag in the
# host's table entry (util, feat, ...) names roles and task files. To change what
# a tag runs, edit its manifest; to add a role, drop it in roles/ and name it in
# a manifest. No edit to this file is needed.
- name: Roles and tasks selected by tag manifests
  hosts: all
  become: true
  # Facts from the first play stay available for the rest of the run; gathering them again costs a second or two per pass.
  gather_facts: false
  tasks:
    - name: Run what this host's tags select
      ansible.builtin.include_role:
        name: fleet_plan
