---
# Applied to hosts tagged util:arkeep (one host — the central backup console).
# Reproduces github.com/arkeep-io/arkeep's deploy/docker/docker-compose.yml
# as a template (verified against that file 2026-10-01) rather than
# vendoring it as a submodule -- it's small and stable, unlike Wazuh's
# cert-heavy multi-file setup (which IS vendored, see stacks/wazuh/).
#
# Secrets come from your private fleet-config repo: arkeep_server_secret_key from
# the secret arkeep.server, arkeep_agent_secret from arkeep.agent. The latter is
# shared with every agent (same file), so the server and the agents hold the
# arkeep.agent password and only the server holds arkeep.server.

# Pinned. v0.9.0 (2026-10-12) was tested with this role's compose (agent enrolment by CSR,
# registration and the job stream all work). Keep the agents on the same version as the
# server and bump both on purpose. Upgrading runs database migrations when the server starts:
# back up the arkeep-data volume first. v0.8.0 made the "user" role read-only.
arkeep_server_version: "v0.9.0"
# The server asks GitHub whether a newer release exists; set false to stop that.
arkeep_server_update_check: true
arkeep_server_dir: /opt/arkeep-server
# Address the published port(s) bind to. Default: this host's Tailscale IP
# (from the inventory), so the service is reachable over the tailnet only; falls
# back to 127.0.0.1 if the host has no Tailscale IP. Docker-published ports
# bypass ufw, so a public VPS must never publish on all interfaces by accident.
# Set "0.0.0.0" to deliberately listen everywhere.
arkeep_server_bind_address: "{{ tailscale_ipv4 | default('127.0.0.1', true) }}"
arkeep_server_http_port: 8080
arkeep_server_grpc_port: 9090
arkeep_server_log_level: info

# Set this once Traefik (from the geotraefik repo) is fronting this node --
# see hosts/roles/arkeep_server/README.md. Required for the agent enrollment
# flow to work through a reverse proxy, and for password-reset email links.
arkeep_server_base_url: ""

# Set to a shared external Docker network name (created once with
# `docker network create <name>`) when Traefik is fronting this node, so
# Traefik can reach the server by container name instead of a host port.
# Leave empty for a standalone deployment with no reverse proxy (compose's
# own default network is used).
arkeep_server_network: ""
