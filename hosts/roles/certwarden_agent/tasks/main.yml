---
# Applied to hosts tagged feat:certwarden: pulls certificates from the central Cert
# Warden and keeps them current. See defaults/main.yml for what goes where.

- name: Validate configuration
  ansible.builtin.import_tasks: validate.yml

- name: Install curl and openssl (and bash, which the script uses)
  ansible.builtin.include_role:
    name: platform
    tasks_from: package
  vars:
    platform_package: [curl, openssl, bash]
    platform_package_update: true
    platform_package_cache_valid_time: 3600

- name: Create the certificate directory
  ansible.builtin.file:
    path: "{{ certwarden_agent_dir }}"
    state: directory
    mode: "0755"

- name: Write the fetch configuration (contains API keys)
  ansible.builtin.template:
    src: certwarden-fetch.conf.j2
    dest: /etc/certwarden-fetch.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the fetch script
  ansible.builtin.template:
    src: certwarden-fetch.sh.j2
    dest: /usr/local/sbin/certwarden-fetch.sh
    owner: root
    group: root
    mode: "0700"

- name: Schedule the daily check
  ansible.builtin.include_role:
    name: platform
    tasks_from: schedule
    apply:
      tags: [timer]
  vars:
    platform_schedule:
      name: certwarden-fetch
      description: "Fetch certificates from Cert Warden"
      timer_description: "Check Cert Warden for renewed certificates daily"
      command: /usr/local/sbin/certwarden-fetch.sh
      calendar: "{{ certwarden_agent_schedule }}"
      randomized_delay: 30min
  tags: [timer]

# Not fatal: on first bring-up Cert Warden may not have issued the certificate
# yet. The timer retries daily; the output below says what happened.
- name: Fetch certificates now
  ansible.builtin.command: /usr/local/sbin/certwarden-fetch.sh
  register: _certwarden_agent_fetch
  changed_when: "'UPDATED' in _certwarden_agent_fetch.stdout"
  failed_when: false
  when: not ansible_check_mode

- name: Report fetch problems
  ansible.builtin.debug:
    msg: "{{ _certwarden_agent_fetch.stderr_lines }}"
  when: not ansible_check_mode and _certwarden_agent_fetch.rc != 0
