---
# Applied to hosts tagged feat:certwarden: every host that consumes certificates
# from the central Cert Warden (typically the Traefik hosts).
#
# What goes where (layered, so a host only sees what it should):
#   certwarden_agent_server_url   fleet vars  e.g. http://100.x.y.z:4050
#   cert: [<name>, ...]           host table  the certificates this host fetches (preferred)
#   certwarden_agent_certs*       fleet vars  [{name: <Cert Warden certificate name>}]  (also works)
#   API keys                      SECRET      one sops file per certificate:
#                                 config/secrets/cw/<name>.yml (scope cw.<name>),
#                                 containing `cert:` and `key:` (the two API keys)
# Any variable whose name starts with certwarden_agent_certs is collected, so a
# group file and one host's file can each contribute. A host reads (and is a
# sops recipient of) only the certificates it lists.
#
# Output, per certificate:  <dir>/<name>/fullchain.pem  and  <dir>/<name>/privkey.pem

certwarden_agent_dir: "{{ common_dir | default('/opt/common') }}/certs"
certwarden_agent_server_url: ""
certwarden_agent_certs: []
# Certificates that live on a DIFFERENT Cert Warden than certwarden_agent_server_url: {<certificate name>: <server url>}.
# Their API keys are still the secret cw.<name>. Example: an org's host that also serves a name issued by another Cert Warden.
certwarden_agent_server_urls: {}

# Cert Warden presents a self-signed certificate until it has issued one for
# itself. Preferred: point this at its CA/cert file. Setting verify to false
# skips verification (acceptable only because the link is already the tailnet).
certwarden_agent_ca_file: ""
certwarden_agent_verify_tls: true

# systemd OnCalendar expression for the daily check.
certwarden_agent_schedule: "*-*-* 03:30:00"

# Files touched after any certificate changes, so Traefik's file provider
# notices and reloads (only touched if they exist).
certwarden_agent_touch_on_change:
  - /opt/traefik/dynamic/20-tls.yml
