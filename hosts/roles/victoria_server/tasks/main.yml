---
- name: Check the settings
  ansible.builtin.assert:
    that:
      - victoria_server_retention | string is match('^[0-9]+[dwy]?$')
      - victoria_server_memory_limit is match('^[0-9]+[kKmMgG]$')
    fail_msg: victoria_server_retention is a number of months (12) or a number with d, w or y (90d), and victoria_server_memory_limit looks like 1024m.
    quiet: true

- name: Mount the shared data disk first (when this host has one)
  ansible.builtin.include_role:
    name: data_disk

- name: Create the service and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop:
    - {path: "{{ victoria_server_dir }}", owner: "{{ victoria_server_admin_owner }}", group: "{{ victoria_server_admin_group }}"}
    - {path: "{{ victoria_server_data_dir }}", owner: "{{ victoria_server_uid }}", group: "{{ victoria_server_gid }}"}

- name: Write the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ victoria_server_dir }}/docker-compose.yml"
    mode: "0640"
  register: _victoria_server_compose

- name: Create the shared network
  community.docker.docker_network:
    name: "{{ victoria_server_network }}"
  when: victoria_server_network | length > 0

- name: Check that no container this role needs is already taken by something else
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [victoria]
    docker_guard_dir: "{{ victoria_server_dir }}"

- name: Start VictoriaMetrics
  community.docker.docker_compose_v2:
    project_src: "{{ victoria_server_dir }}"
    state: present
    pull: "{{ 'always' if _victoria_server_compose.changed else 'missing' }}"
  when: not ansible_check_mode or not _victoria_server_compose.changed

- name: Wait until VictoriaMetrics is healthy
  ansible.builtin.uri:
    url: "http://{{ victoria_server_bind_address }}:{{ victoria_server_port }}/health"
    return_content: true
  register: _victoria_server_health
  until: _victoria_server_health.status == 200
  retries: 12
  delay: 5
  changed_when: false
  when: not ansible_check_mode
