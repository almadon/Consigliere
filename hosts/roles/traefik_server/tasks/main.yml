---
- name: Collect this host's routes from every layer that defines them
  ansible.builtin.set_fact:
    _traefik_server_sources: "{{ query('ansible.builtin.varnames', '^traefik_server_routes(_.*)?$') | sort }}"
    _traefik_server_routes: >-
      {{ query('ansible.builtin.varnames', '^traefik_server_routes(_.*)?$')
         | map('extract', vars) | flatten }}

- name: Show which variable each route comes from
  ansible.builtin.debug:
    msg: >-
      {{ ('No Traefik routes on this host. Define traefik_server_routes (or traefik_server_routes_<anything>)'
          ~ ' in any vars layer this host sees: util_traefik.yml, a service group file (util_arkeep.yml, ...),'
          ~ ' all.yml or vars/host/<host>.yml.')
         if _traefik_server_sources | length == 0 else
         ('Traefik routes on this host (' ~ (_traefik_server_routes | length) ~ '): '
          ~ (_traefik_server_sources
             | zip(_traefik_server_sources | map('extract', vars) | map('map', attribute='name') | map('join', ', '))
             | map('join', ' = ') | join('; '))) }}

- name: Summarise the routes for validation
  ansible.builtin.set_fact:
    _traefik_server_names: "{{ _traefik_server_routes | map(attribute='name', default='') | list }}"
    _traefik_server_without_backend: >-
      {{ _traefik_server_routes | rejectattr('backend', 'defined') | list | length }}
    _traefik_server_without_match: >-
      {{ _traefik_server_routes | rejectattr('host', 'defined') | rejectattr('rule', 'defined') | list | length }}

- name: Validate the routes
  ansible.builtin.assert:
    that:
      - >-
        _traefik_server_names | select('match', '^[a-z0-9][a-z0-9-]*$') | list | length
        == _traefik_server_names | length
      - _traefik_server_names | unique | list | length == _traefik_server_names | length
      - _traefik_server_without_backend | int == 0
      - _traefik_server_without_match | int == 0
    fail_msg: >-
      Every traefik_server_routes* entry needs a unique lowercase name (a-z, 0-9, dash),
      a backend URL, and a host (or a full rule). Check the routes defined for this host.
    quiet: true

- name: Create the Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ traefik_server_dir }}"
    - "{{ traefik_server_dir }}/dynamic"

- name: Render Traefik's dynamic configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ traefik_server_dir }}/dynamic/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: 00-base.yml.j2, dest: 00-base.yml }
    - { src: 10-routes.yml.j2, dest: 10-routes.yml }
    - { src: 20-tls.yml.j2, dest: 20-tls.yml }
  loop_control:
    label: "{{ item.dest }}"

- name: Create the shared proxy network
  community.docker.docker_network:
    name: "{{ traefik_server_network }}"
  when: traefik_server_network | length > 0

- name: Deploy Traefik
  when: traefik_server_deploy
  block:
    - name: Write Traefik's static configuration
      ansible.builtin.template:
        src: traefik.yml.j2
        dest: "{{ traefik_server_dir }}/traefik.yml"
        mode: "0644"

    - name: Make sure the certificates directory exists
      ansible.builtin.file:
        path: "{{ traefik_server_certs_dir }}"
        state: directory
        mode: "0750"

    - name: Write the compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ traefik_server_dir }}/docker-compose.yml"
        mode: "0640"
      register: _traefik_server_compose

    - name: Check that no container this role needs is already taken by something else
      ansible.builtin.include_role:
        name: docker
        tasks_from: guard_containers
      vars:
        docker_guard_containers: [traefik]
        docker_guard_dir: "{{ traefik_server_dir }}"

    - name: Start Traefik
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_server_dir }}"
        state: present
        pull: "{{ 'always' if _traefik_server_compose.changed else 'missing' }}"
      # In a check run the directory and compose file above are not really written yet.
      when: not ansible_check_mode or not _traefik_server_compose.changed
