---
- name: Collect this host's routes from every layer that defines them
  ansible.builtin.set_fact:
    _traefik_server_sources: "{{ query('ansible.builtin.varnames', '^traefik_server_routes(_.*)?$') | sort }}"
    _traefik_server_routes: >-
      {{ query('ansible.builtin.varnames', '^traefik_server_routes(_.*)?$')
         | map('extract', vars) | flatten }}

- name: Show which variable each route comes from
  ansible.builtin.debug:
    msg: >-
      {{ ('No Traefik routes on this host. Define traefik_server_routes (or traefik_server_routes_<anything>)'
          ~ ' in any vars layer this host sees: util_traefik.yml, a service group file (util_arkeep.yml, ...),'
          ~ ' all.yml or vars/host/<host>.yml.')
         if _traefik_server_sources | length == 0 else
         ('Traefik routes on this host (' ~ (_traefik_server_routes | length) ~ '): '
          ~ (_traefik_server_sources
             | zip(_traefik_server_sources | map('extract', vars) | map('map', attribute='name') | map('join', ', '))
             | map('join', ' = ') | join('; '))) }}

- name: Summarise the routes for validation
  ansible.builtin.set_fact:
    _traefik_server_names: >-
      {{ (_traefik_server_routes + (traefik_server_static_sites | default([]))) | map(attribute='name', default='') | list }}
    _traefik_server_bad_profiles: >-
      {{ _traefik_server_routes | selectattr('profile', 'defined')
         | rejectattr('profile', 'in', ['app', 'strict', 'relaxed', 'framed', 'none']) | list }}
    _traefik_server_without_backend: >-
      {{ _traefik_server_routes | rejectattr('backend', 'defined') | rejectattr('redirect', 'defined') | list | length }}
    _traefik_server_without_match: >-
      {{ _traefik_server_routes | rejectattr('host', 'defined') | rejectattr('rule', 'defined') | list | length }}

- name: Find mistakes in the per-route CSP additions
  ansible.builtin.set_fact:
    _traefik_server_csp_problems: >-
      {%- set bad = [] -%}
      {%- for r in _traefik_server_routes -%}
      {%- if r.csp_extra is defined -%}
      {%- if r.csp_extra is not mapping -%}{%- set _ = bad.append(r.name ~ ': csp_extra must be a map of directive to list of sources') -%}
      {%- else -%}
      {%- for d, srcs in r.csp_extra.items() -%}
      {%- if d is not match('^[a-z][a-z-]*$') -%}{%- set _ = bad.append(r.name ~ ': "' ~ d ~ '" is not a CSP directive name') -%}{%- endif -%}
      {%- if srcs is string or srcs is not iterable -%}{%- set _ = bad.append(r.name ~ ': ' ~ d ~ ' must be a list of sources') -%}
      {%- else -%}{%- for x in srcs -%}{%- if x is not string or x is not match('^[^\s;,]+$') -%}{%- set _ = bad.append(r.name ~ ': bad source ' ~ (x | string)) -%}{%- endif -%}{%- endfor -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endif -%}
      {%- if r.frame_ancestors is defined -%}
      {%- if r.frame_ancestors is string or r.frame_ancestors is not iterable -%}{%- set _ = bad.append(r.name ~ ': frame_ancestors must be a list of origins') -%}
      {%- else -%}{%- for x in r.frame_ancestors -%}{%- if x is not string or x is not match('^[^\s;,]+$') -%}{%- set _ = bad.append(r.name ~ ': bad origin ' ~ (x | string)) -%}{%- endif -%}{%- endfor -%}{%- endif -%}
      {%- endif -%}
      {%- if (r.csp_extra is defined or r.frame_ancestors is defined) and (r.profile | default(traefik_server_default_profile)) == 'none' -%}
      {%- set _ = bad.append(r.name ~ ': csp_extra / frame_ancestors cannot be used with profile none (it sends no security headers)') -%}
      {%- endif -%}
      {%- endfor -%}
      {{ bad | to_json }}

- name: Refuse mistakes in the per-route CSP additions
  ansible.builtin.assert:
    that: _traefik_server_csp_problems | from_json | length == 0
    fail_msg: >-
      {{ _traefik_server_csp_problems | from_json | join('; ') }}. csp_extra is a map of CSP directive names to lists of sources and frame_ancestors a list of origins;
      no source may contain spaces, commas or semicolons.
    quiet: true

- name: Validate the routes
  ansible.builtin.assert:
    that:
      - >-
        _traefik_server_names | select('match', '^[a-z0-9][a-z0-9-]*$') | list | length
        == _traefik_server_names | length
      - _traefik_server_names | unique | list | length == _traefik_server_names | length
      - _traefik_server_without_backend | int == 0
      - _traefik_server_without_match | int == 0
      - _traefik_server_bad_profiles | length == 0
      - traefik_server_default_profile in ['app', 'strict', 'relaxed', 'framed', 'none']
    fail_msg: >-
      Every traefik_server_routes* entry needs a unique lowercase name (a-z, 0-9, dash),
      a backend URL (or `redirect: {to: https://..., permanent: true}`), and a host (or a full rule); profile, if given, must be app, strict, relaxed, framed or none.
    quiet: true

# Two routes that answer the same request make Traefik pick one silently. Refuse before anything is written.
- name: Find routes that match the same request
  ansible.builtin.set_fact:
    _traefik_server_duplicate_matches: >-
      {%- set keys = [] -%}
      {%- for r in _traefik_server_routes -%}
        {%- if r.rule is defined -%}
          {%- set _ = keys.append(r.rule | trim) -%}
        {%- else -%}
          {%- for h in ([r.host] if r.host is string else r.host) -%}
            {%- set _ = keys.append('Host(`' ~ (h | lower) ~ '`)') -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set dups = [] -%}
      {%- for k in keys | unique -%}
        {%- if keys | select('equalto', k) | list | length > 1 -%}{%- set _ = dups.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ dups | to_json }}

- name: Refuse conflicting routes
  ansible.builtin.assert:
    that: _traefik_server_duplicate_matches | from_json | length == 0
    fail_msg: >-
      These routes are defined more than once on this host, so Traefik would pick one at random: {{
      _traefik_server_duplicate_matches | from_json | join(' ; ') }}. Remove the duplicate (see "Show which variable
      each route comes from" above for where each route is defined). Nothing was changed on this host.
    quiet: true

- name: Create the Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ traefik_server_dir }}"
    - "{{ traefik_server_dir }}/dynamic"

- name: Render Traefik's dynamic configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ traefik_server_dir }}/dynamic/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: 00-base.yml.j2, dest: 00-base.yml }
    - { src: 05-security.yml.j2, dest: 05-security.yml }
    - { src: 10-routes.yml.j2, dest: 10-routes.yml }
    - { src: 20-tls.yml.j2, dest: 20-tls.yml }
  loop_control:
    label: "{{ item.dest }}"

- name: Create the shared proxy networks
  community.docker.docker_network:
    name: "{{ item }}"
  loop: "{{ traefik_server_networks }}"

- name: Deploy Traefik
  when: traefik_server_deploy
  block:
    - name: Write Traefik's static configuration
      ansible.builtin.template:
        src: traefik.yml.j2
        dest: "{{ traefik_server_dir }}/traefik.yml"
        mode: "0644"

    - name: Write the static sites' nginx configuration
      ansible.builtin.template:
        src: static-sites.conf.j2
        dest: "{{ traefik_server_dir }}/static-sites.conf"
        mode: "0644"
      when: traefik_server_static_sites | length > 0

    # Same mode as certwarden_agent (which owns this directory): two roles setting different modes
    # would change it back and forth on every run.
    - name: Make sure the certificates directory exists
      ansible.builtin.file:
        path: "{{ traefik_server_certs_dir }}"
        state: directory
        mode: "0755"

    - name: Write the compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ traefik_server_dir }}/docker-compose.yml"
        mode: "0640"
      register: _traefik_server_compose

    - name: Check that no container this role needs is already taken by something else
      ansible.builtin.include_role:
        name: docker
        tasks_from: guard_containers
      vars:
        docker_guard_containers: "{{ ['traefik'] + (['traefik-static'] if traefik_server_static_sites | length > 0 else []) }}"
        docker_guard_dir: "{{ traefik_server_dir }}"

    - name: Start Traefik
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_server_dir }}"
        state: present
        pull: "{{ 'always' if _traefik_server_compose.changed else 'missing' }}"
      # In a check run the directory and compose file above are not really written yet.
      when: not ansible_check_mode or not _traefik_server_compose.changed
