---
# Applied to hosts tagged util:traefik: hosts that run Traefik as a reverse proxy.
# The role deploys Traefik itself (compose in traefik_server_dir, set
# traefik_server_deploy: false to leave that to another tool) and prepares what it mounts:
#
#   <dir>/dynamic/00-base.yml    ping + http->https redirect (framework-owned)
#   <dir>/dynamic/10-routes.yml  THIS host's routes, collected from variables
#   <dir>/dynamic/20-tls.yml     certificates found under <certs dir>
#
# so every proxy host shares one base but serves only its own routes, and holds
# NO DNS API key: certificates arrive as files from Cert Warden
# (see certwarden_agent), or from any issuer that writes the same files.
#
# ROUTES: define one or more variables whose names start with
# traefik_server_routes (e.g. traefik_server_routes_vault in
# config/vars/host/web-host.yml, or traefik_server_routes_arkeep in the
# the util:arkeep hosts file). This role gathers every such variable that the host
# can see -- i.e. from the groups it belongs to plus its own host file -- so the
# route follows the service. Each route:
#   - name:        unique, [a-z0-9-]
#     host:        hostname (or a list of hostnames)
#     backend:     URL Traefik forwards to, e.g. http://vaultwarden:80
#                  (same-host containers via the shared network by name; other
#                  hosts via a Tailscale address)
#     middlewares: optional list of middleware names
#     rule:        optional full Traefik rule, replacing the host-based one

traefik_server_dir: /opt/traefik
traefik_server_deploy: true
# Pinned (v3.6.25, the 3.6 line geotraefik used). Bump on purpose.
traefik_server_version: "v3.6.25"
traefik_server_http_port: 80
traefik_server_https_port: 443
# Proxies (e.g. a Caddy in front) whose X-Forwarded-* headers Traefik should trust: IPs/CIDRs.
traefik_server_trusted_ips: []
traefik_server_log_level: INFO

# Where certificates live on the host (certwarden_agent_dir), and the names to
# load from there. Defaults to every certificate certwarden_agent fetches.
traefik_server_certs_dir: "{{ common_dir | default('/opt/common') }}/certs"
# Certificates to serve: the host's `cert:` tag values plus anything in certwarden_agent_certs*
# (plain names or {name: ...} entries).
traefik_server_certificates: >-
  {{ ((cert | default([]))
      + (query('ansible.builtin.varnames', '^certwarden_agent_certs(_.*)?$') | map('extract', vars) | flatten
         | selectattr('name', 'defined') | map(attribute='name') | list)
      + (query('ansible.builtin.varnames', '^certwarden_agent_certs(_.*)?$') | map('extract', vars) | flatten
         | reject('mapping') | list)) | unique | list }}

# Entry point names, matching the static traefik.yml in geotraefik.
traefik_server_entrypoint_web: web
traefik_server_entrypoint_websecure: websecure

# The Docker network shared by the proxy and everything it fronts on this host
# (e.g. "proxynet"). Created if set; empty = don't manage one.
traefik_server_network: ""
