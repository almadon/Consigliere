---
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone (only when baseline_timezone is set; otherwise leave it alone)
  community.general.timezone:
    name: "{{ baseline_timezone }}"
  when: baseline_timezone | length > 0

- name: Keep the operating system's hostname short (no domain part)
  ansible.builtin.import_tasks: hostname.yml
  when: baseline_short_hostname | bool

# --- unattended upgrades ----------------------------------------------------
- name: Turn on the periodic apt update + unattended upgrade
  when: baseline_unattended_upgrades_manage | bool
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

# A drop-in instead of editing the vendor's 50unattended-upgrades: apt reads
# apt.conf.d in order and the last value wins, so this needs no particular
# contents (or even the package) to exist first, and survives package upgrades.
- name: Configure unattended-upgrades (reboot, cleanup, extra origins)
  when: baseline_unattended_upgrades_manage | bool
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52consigliere-unattended-upgrades
    content: |
      // Managed by Ansible (hosts/roles/baseline)
      Unattended-Upgrade::Automatic-Reboot "{{ baseline_unattended_upgrades_auto_reboot | lower }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ baseline_unattended_upgrades_reboot_time }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "{{ baseline_unattended_upgrades_remove_unused | lower }}";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "{{ baseline_unattended_upgrades_remove_unused | lower }}";
      {% for o in baseline_unattended_upgrades_extra_origins %}
      Unattended-Upgrade::Origins-Pattern:: "{{ o }}";
      {% endfor %}
    owner: root
    group: root
    mode: "0644"

- name: Make sure the apt timers that drive it are enabled
  when: baseline_unattended_upgrades_manage | bool
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Authorize the fleet's admin SSH keys for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    comment: fleet admin key
    exclusive: false
  loop: "{{ baseline_admin_ssh_keys }}"
  loop_control:
    label: "{{ item.split()[-1] if item.split() | length > 2 else item[:30] }}"

- name: Authorize the bastion's key for root (with its options, for example from=<bastion address>)
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    comment: fleet bastion key
    exclusive: false
  loop: "{{ baseline_bastion_ssh_keys }}"
  loop_control:
    label: "{{ item.split()[-1] if item.split() | length > 2 else item[:30] }}"

- name: Turn off SSH password logins (only once an admin key is installed)
  when: not baseline_ssh_password_auth and baseline_admin_ssh_keys | length > 0
  block:
    - name: Write the sshd drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-consigliere.conf
        content: |
          # Managed by Ansible (hosts/roles/baseline). SSH keys only.
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

- name: Remove the password-login lock-down again when it is not wanted
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-consigliere.conf
    state: absent
  when: baseline_ssh_password_auth
  notify: Reload sshd

- name: Kernel settings the fleet's services expect (see baseline_sysctl)
  ansible.builtin.include_tasks: sysctl.yml
  vars:
    baseline_sysctl_apply_file: /etc/sysctl.d/90-consigliere.conf
    baseline_sysctl_apply_settings: "{{ baseline_sysctl }}"
  when: baseline_sysctl_manage | bool
