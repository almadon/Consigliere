---
# Empty = don't touch the host's timezone. Set it here (or per group/host), or use a
# prop manifest that runs the timezone role (prop: [tz_est]).
baseline_timezone: ""

# Every Debian/Ubuntu node gets these (bootstrap.sh installs the first few itself, since
# it needs them before this role can run).
baseline_packages:
  - sudo
  - curl
  - gnupg
  - ca-certificates
  - python3-apt
  - git
  - jq
  - rsync
  - htop
  - ufw
  - unattended-upgrades
  - apt-listchanges

# Set false on a host whose packages must only change on purpose (a Proxmox VE node: see the util: [pve] tag): the role then writes no
# unattended-upgrades configuration and leaves the apt timers alone. Also leave "unattended-upgrades" out of baseline_packages there, because
# installing that package turns the upgrades on by itself.
baseline_unattended_upgrades_manage: true
# Unattended upgrades: security and stable updates from Debian's default origins are
# applied automatically (Debian's own 50unattended-upgrades is left alone; this role adds
# a drop-in that is read after it).
baseline_unattended_upgrades_auto_reboot: false   # flip on per-host once you trust it
baseline_unattended_upgrades_reboot_time: "04:00"  # used when auto-reboot is on
baseline_unattended_upgrades_remove_unused: true  # autoremove packages left unused
# Extra origins to upgrade automatically, e.g. ["origin=Tailscale"]. Don't add Docker's:
# an upgrade restarts the daemon and with it the containers.
baseline_unattended_upgrades_extra_origins: []

# SSH access. Public keys that may log in as root on every node (the fleet's admin keys): a
# list of "ssh-ed25519 AAAA... comment" lines. Set it once in config/vars/group/all.yml and a
# new node accepts your key on its first apply. Keys already on the host are left alone.
baseline_admin_ssh_keys: []
# Allow password logins over SSH. Leave true until the key above works on every node, then set
# false (the role then also refuses to do it while baseline_admin_ssh_keys is empty, so it can
# never lock you out of a host it has not given a key).
baseline_ssh_password_auth: true

# Kernel settings that fix well-known warnings and failures of the services this fleet runs. Written to
# /etc/sysctl.d/90-consigliere.conf and applied at once. Add or override keys per group or host, set a key to
# null to skip it, or set baseline_sysctl_manage: false to leave sysctl alone.
#   vm.overcommit_memory   Redis/Valkey ("Memory overcommit must be enabled!"): background saves fail without it
#   net.core.somaxconn     Redis/Valkey, nginx, Traefik: the default 4096 is fine on current kernels, 1024 is the floor
#   vm.max_map_count       OpenSearch/Elasticsearch/Wazuh indexer refuse to start below 262144
#   fs.inotify.*           many containers watching files: "too many open files" / "inotify limit reached"
baseline_sysctl_manage: true
baseline_sysctl:
  vm.overcommit_memory: 1
  net.core.somaxconn: 4096
  vm.max_map_count: 262144
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 1024
# Files this fleet owns (never edited when retiring hand-made settings).
baseline_sysctl_managed_files:
  - /etc/sysctl.d/90-consigliere.conf
  - /etc/sysctl.d/99-tailscale.conf
# Keys that are limits: only ever raised to the value above, never lowered (a host whose kernel or admin already
# set them higher keeps the higher value).
baseline_sysctl_raise_only:
  - net.core.somaxconn
  - vm.max_map_count
  - fs.inotify.max_user_watches
  - fs.inotify.max_user_instances

# Trim an FQDN hostname ("nova.core.example.com") to its first label ("nova"), fix /etc/hosts to match, and stop
# cloud-init from restoring it. A host that already has a short name is untouched.
baseline_short_hostname: true

# Keys of a bastion (a host such as Warpgate that opens SSH sessions to your nodes on your behalf), written to root's authorized_keys as full lines WITH their
# options, so you can pin them: for example
#   - 'from="100.100.1.100",no-agent-forwarding,no-X11-forwarding ssh-ed25519 AAAA... warpgate'
# `from` limits the key to connections coming from the bastion's address; without it the key works from anywhere. Added next to the admin keys, never replacing them.
baseline_bastion_ssh_keys: []

# SSH user certificates. List the PUBLIC key(s) of a certificate authority here and sshd trusts certificates signed by it for root, instead of (and next to) listed keys:
# you sign a short-lived certificate for a throwaway key once (one approval in your agent) and use it on every host with no further prompts. See the fleet repo's
# runbooks/ssh-certificates.md and scripts/ssh-cert.sh. A certificate must carry one of baseline_ssh_ca_principals to be accepted for root. Empty list = no change;
# removing a CA from the list revokes everything it signed at the next run. Your admin keys keep working either way (the break-glass path).
baseline_ssh_user_ca_keys: []
baseline_ssh_ca_principals: [fleet-admin]

# The reconciliation run (fleet-reconcile.service, two ansible passes) is heavy on a small host: about 2m40s of CPU every 20 minutes on a 1 vCPU VPS. A drop-in gives it a low
# priority so the services on the host win whenever they need the CPU, and lets a run that has nothing to do be skipped: when neither the framework nor the fleet repo has a
# new commit since the last successful apply, the run only fetches, and a full run is still forced every baseline_reconcile_full_every_secs (drift correction). `reconcile-now`
# and any host's first run always do the full work. 0 = never skip. Only on hosts that have fleet-reconcile.service.
baseline_reconcile_low_priority: true
baseline_reconcile_full_every_secs: 21600

# Cap the systemd journal (it is shipped to Loki by the otel role, so the local copy is only for the last days). "" leaves journald's own limits alone.
baseline_journald_max_use: "200M"
baseline_journald_runtime_max_use: "64M"
