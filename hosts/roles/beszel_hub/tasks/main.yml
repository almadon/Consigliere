---
- name: Require the hub's public URL
  ansible.builtin.assert:
    that: beszel_hub_url | length > 0
    fail_msg: Set beszel_hub_url (the address agents and people use), e.g. https://beszel.example.com.
    quiet: true

- name: Create the hub directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ beszel_hub_dir }}"
    - "{{ beszel_hub_dir }}/data"

- name: Write the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ beszel_hub_dir }}/docker-compose.yml"
    mode: "0640"
  register: _beszel_hub_compose

- name: Create the shared proxy network
  community.docker.docker_network:
    name: "{{ beszel_hub_network }}"
  when: beszel_hub_network | length > 0

- name: Check that no container this role needs is already taken by something else
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [beszel-hub]
    docker_guard_dir: "{{ beszel_hub_dir }}"

- name: Start the Beszel hub
  community.docker.docker_compose_v2:
    project_src: "{{ beszel_hub_dir }}"
    state: present
    pull: "{{ 'always' if _beszel_hub_compose.changed else 'missing' }}"
  # In a check run the directory and compose file above are not really written yet.
  when: not ansible_check_mode or not _beszel_hub_compose.changed
