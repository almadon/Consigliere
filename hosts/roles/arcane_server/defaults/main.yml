---
# Applied to hosts tagged util:arcane (one host -- the central GitOps/Docker UI
# that stacks/ across this repo, geotraefik, etc. get deployed through).
# Reproduces github.com/getarcaneapp/arcane's docker/examples/compose.proxy.yaml
# (verified 2026-10-01 -- note the repo moved from ofkm/arcane to
# getarcaneapp/arcane; update any other links you find to the old URL).
#
# Uses the docker-socket-proxy-hardened variant rather than compose.basic.yaml
# since this node is internet-facing (also runs the reverse proxy) --
# Arcane never touches the real docker.sock directly.
#
# arcane_server_encryption_key comes from your private fleet-config repo's
# secret arcane.server (config/secrets/arcane/server.yml).

# Pinned instead of :latest (v2.15.1, 2026-10-07; the socket proxy v0.5.0, 2026-07-27). Bump on purpose.
arcane_server_version: "v2.15.1"
arcane_server_proxy_version: "v0.5.0"
arcane_server_dir: /opt/arcane
# Address the published port(s) bind to. Default: this host's Tailscale IP
# (from the inventory), so the service is reachable over the tailnet only; falls
# back to 127.0.0.1 if the host has no Tailscale IP. Docker-published ports
# bypass ufw, so a public VPS must never publish on all interfaces by accident.
# Set "0.0.0.0" to deliberately listen everywhere.
arcane_server_bind_address: "{{ tailscale_ipv4 | default('127.0.0.1', true) }}"
arcane_server_port: 3552

# Set to a shared external Docker network name once Traefik is fronting
# this node (see hosts/roles/arkeep_server/README.md -- same pattern
# applies here). Leave empty to expose Arcane's port directly instead.
arcane_server_network: ""
