---
# Garage (https://garagehq.deuxfleurs.fr): a small S3-compatible object store. One node here (replication 1), bound to this
# host's Tailscale address, for services that want S3 (Outline attachments, Tududi, ...).
# The cluster's RPC secret comes from the secret garage.server (config/secrets/garage/server.yml):
#   garage_rpc_secret: <64 hex characters>        (scripts/garage.sh init makes one)
garage_version: "2.4.1"
garage_dir: /opt/garage
# Metadata (a small database, fast storage matters) and the data blocks are separate. By default the data sits on the root
# disk; on a host with a dedicated data disk (data_disk_device, see the data_disk role) set it under the mount: /srv/bulk/garage.
garage_meta_dir: "{{ garage_dir }}/meta"
garage_data_dir: /srv/garage
# S3 API address. The tailnet address by default (Docker-published ports bypass ufw; the docker guard also drops outside
# sources). Containers on this host can instead join garage_network and use http://garage:3900.
garage_bind_address: "{{ tailscale_ipv4 | default('127.0.0.1', true) }}"
garage_s3_port: 3900
garage_network: ""
garage_s3_region: garage
# How much of the disk the cluster layout may use (a number and a unit: 500G, 1T). Set it a little under the disk's size.
# Only read when the node first joins the layout; to change it later: docker exec garage /garage layout assign -c <size> <node>
garage_capacity: "100G"
garage_zone: dc1
# Garage writes a copy of its metadata database to garage_meta_dir/snapshots on this schedule (a consistent copy to back up).
garage_metadata_snapshot_interval: 6h
# Buckets and the keys that may use them. Keys are generated by Garage; read a secret with
#   docker exec garage /garage key info <key-name> --show-secret
# garage_buckets:
#   - name: outline
#     max_size: 200G              # optional quota
#     keys:
#       - {name: outline, read: true, write: true, owner: false}
garage_buckets: []

# Garage's admin API (reachable only inside the compose network, never published) and a web UI in front of it
# (https://github.com/khairul169/garage-webui, MIT): cluster status, buckets, keys, a browser for objects. The UI has its own sign-in only
# (basic, bcrypt), so keep it off the open internet. Both need values from the secret garage.server:
#   garage_admin_token       any long random string
#   garage_webui_auth        "user:bcrypt-hash"  (htpasswd -nbBC 10 admin 'password')
# scripts/garage.sh webui in the fleet repo adds them to an existing secret.
garage_admin_enabled: true
garage_webui_enabled: true
garage_webui_version: "1.1.0"
garage_webui_port: 3909
garage_webui_bind_address: "{{ tailscale_ipv4 | default('127.0.0.1', true) }}"
