---
- name: Require a source host
  ansible.builtin.assert:
    that: restic_mirror_source | length > 0
    fail_msg: Set restic_mirror_source (the Tailscale hostname of the REST server to copy from).
    quiet: true

- name: Install rsync and OpenSSH client (and bash, which the script uses)
  ansible.builtin.include_role:
    name: platform
    tasks_from: package
  vars:
    platform_package: [rsync, openssh-client, bash]

- name: Make sure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"

- name: Check that the pinned host keys are public keys
  ansible.builtin.assert:
    that: restic_mirror_source_host_keys | map('trim') | select('match', '^(ssh-[a-z0-9]+|ecdsa-sha2-[a-z0-9]+) AAAA') | list | length == restic_mirror_source_host_keys | length
    fail_msg: >-
      restic_mirror_source_host_keys must hold lines like "ssh-ed25519 AAAA..." (the contents of /etc/ssh/ssh_host_ed25519_key.pub on
      {{ restic_mirror_source }}), nothing else.
    quiet: true

# Matched by the source's name (the script connects with HostKeyAlias), so the file stays right when the source's tailnet address changes.
- name: Pin the source's SSH host keys
  when: restic_mirror_source_host_keys | length > 0
  ansible.builtin.copy:
    dest: /root/.ssh/restic_mirror_known_hosts
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (hosts/roles/restic_mirror). The SSH host keys of {{ restic_mirror_source }}, from the fleet.
      {% for k in restic_mirror_source_host_keys %}
      {{ restic_mirror_source }} {{ (k | trim).split()[0:2] | join(' ') }}
      {% endfor %}

- name: Remove the pinned host keys when none are set any more
  when: restic_mirror_source_host_keys | length == 0
  ansible.builtin.file:
    path: /root/.ssh/restic_mirror_known_hosts
    state: absent

- name: Create the mirror's SSH key (once)
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C "restic-mirror@{{ inventory_hostname }}" -f /root/.ssh/restic_mirror
    creates: /root/.ssh/restic_mirror
  when: not ansible_check_mode

- name: Read the public key
  ansible.builtin.slurp:
    src: /root/.ssh/restic_mirror.pub
  register: _restic_mirror_pub
  failed_when: false

- name: Show the public key the source host must authorize
  ansible.builtin.debug:
    msg: >-
      Put this in restic_server_mirror_keys on {{ restic_mirror_source }}:
      {{ (_restic_mirror_pub.content | b64decode | trim)
      if _restic_mirror_pub.content is defined else '(created on the real run)' }}

- name: Create the destination directory
  ansible.builtin.file:
    path: "{{ restic_mirror_dest_dir }}"
    state: directory
    mode: "0750"

- name: Install the mirror script
  ansible.builtin.template:
    src: fleet-restic-mirror.sh.j2
    dest: /usr/local/sbin/fleet-restic-mirror.sh
    owner: root
    group: root
    mode: "0750"

- name: Schedule the mirror
  ansible.builtin.include_role:
    name: platform
    tasks_from: schedule
  vars:
    platform_schedule:
      name: fleet-restic-mirror
      header: "Managed by Ansible (hosts/roles/restic_mirror)"
      description: "Mirror restic repositories from {{ restic_mirror_source }}"
      timer_description: "Scheduled restic mirror"
      command: /usr/local/sbin/fleet-restic-mirror.sh
      after:
        - tailscaled.service
      calendar: "{{ restic_mirror_schedule }}"
      randomized_delay: "{{ restic_mirror_randomized_delay }}"
