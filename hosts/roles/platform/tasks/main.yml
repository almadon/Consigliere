---
# Works out what kind of machine this is, once, and leaves the answer in facts that roles and the planner read:
#   platform_family        debian | alpine | unraid | macos | unknown   (a profile file in hosts/platforms/)
#   platform_arch          amd64 | arm64 | armv7 | the raw value
#   platform_runtime_mode  host | container   (what this run can change)
#   platform_capabilities  what a role can count on, e.g. [host, apt, systemd, docker, ufw]
#   platform_defaults      the profile's defaults (package manager, init, service names)
# Changes nothing on the host. See hosts/platforms/README.md and docs/decisions.md, entry 19.
- name: Detect the platform family from the facts
  ansible.builtin.set_fact:
    _platform_detected: >-
      {{ {'Debian': 'debian', 'Alpine': 'alpine', 'Darwin': 'macos'}.get(ansible_facts['os_family'] | default(''),
         (ansible_facts['os_family'] | default('unknown')) | lower) }}
  tags: [always]

- name: Read the profile for it
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', _platform_candidates) }}"
    name: _platform_profile
  vars:
    # In order: platform_host (set by a container bootstrap or the entry playbook); in a container run the host table's `os` (its facts describe the container, not the machine);
    # otherwise what the facts say. In a host run the table never overrides the facts: a wrong entry must not make a host run another platform's roles. Ubuntu uses the debian profile.
    _platform_raw: "{{ (platform_host | string) or ((os | default('') | string | lower) if platform_runtime == 'container' else '') or _platform_detected }}"
    _platform_wanted: "{{ {'ubuntu': 'debian', 'raspbian': 'debian'}.get(_platform_raw, _platform_raw) }}"
    _platform_candidates:
      - "{{ role_path }}/../../platforms/{{ _platform_wanted }}.yml"
      - "{{ role_path }}/../../platforms/unknown.yml"
  tags: [always]

- name: Publish the platform facts
  ansible.builtin.set_fact:
    platform_family: "{{ _platform_profile.family }}"
    platform_tier: "{{ _platform_profile.tier }}"
    platform_arch: >-
      {{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64', 'armv7l': 'armv7'}.get(ansible_facts['architecture'] | default(''),
         ansible_facts['architecture'] | default('unknown')) }}
    platform_runtime_mode: "{{ 'container' if (platform_runtime == 'container' or _platform_profile.tier == 'container') else 'host' }}"
    platform_defaults: "{{ _platform_profile.defaults | default({}) }}"
  tags: [always]

# In a container run the profile's host-level capabilities do not apply: the facts describe the container, and nothing but the Docker socket reaches the machine.
- name: Publish what a role can count on
  ansible.builtin.set_fact:
    platform_capabilities: >-
      {{ (_platform_profile.capabilities | intersect(['docker'])) if platform_runtime_mode == 'container' else _platform_profile.capabilities }}
  tags: [always]

# The host table (os:, arch:) is what the tooling uses before a host has ever run anything, so a disagreement is worth a line in the log. In a container run the
# facts describe the container, so only the CPU can be compared.
- name: Say when the host table disagrees with what this host reports
  ansible.builtin.debug:
    msg: >-
      host table: {{ {'os': os | default('-'), 'arch': arch | default('-')} }}; this host reports family {{ _platform_detected }} ({{ platform_runtime_mode }} run)
      and arch {{ platform_arch }}. Fix the entry in inventory/hosts.yml.
  when: >-
    (arch is defined and (arch | string) != platform_arch) or
    (os is defined and platform_runtime_mode == 'host'
     and {'ubuntu': 'debian', 'raspbian': 'debian'}.get(os | string | lower, os | string | lower) != _platform_detected)
  tags: [always]
