---
- name: Is the Tailscale apt source already set up another way?
  ansible.builtin.include_role:
    name: baseline
    tasks_from: apt_foreign_source
  vars:
    baseline_apt_source_host: pkgs.tailscale.com
    baseline_apt_our_files: [/etc/apt/sources.list.d/tailscale.list]
    baseline_apt_our_keyrings: [/usr/share/keyrings/tailscale-archive-keyring.gpg]

- name: Add Tailscale apt repo + install
  block:
    # Fetched once, when missing: get_url on an old existing file reports "changed" in every check pass (it cannot download
    # then, so it assumes the server copy is newer). To rotate the key or the list, delete the file.
    - name: Are the Tailscale key and repo list already there?
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/share/keyrings/tailscale-archive-keyring.gpg
        - /etc/apt/sources.list.d/tailscale.list
      register: _tailscale_files

    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      register: _tailscale_key
      when:
        - _baseline_apt_foreign | length == 0
        - not _tailscale_files.results[0].stat.exists

    - name: Add Tailscale apt repo
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
      register: _tailscale_repo
      when:
        - _baseline_apt_foreign | length == 0
        - not _tailscale_files.results[1].stat.exists

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      # In a check run on a new host the repo files above are only simulated, so apt can't see the package.
      when: not ansible_check_mode or not (_tailscale_key.changed | default(false) or _tailscale_repo.changed | default(false))

- name: Is tailscale installed?
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: _tailscale_bin

- name: Nothing more to check until tailscale is really installed
  ansible.builtin.meta: end_role
  when: ansible_check_mode and not _tailscale_bin.stat.exists

- name: Enable + start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Host settings Tailscale warns about (forwarding, UDP GRO)
  ansible.builtin.include_tasks: tuning.yml

- name: Check tailnet state
  ansible.builtin.command: tailscale status --json
  register: _tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false   # read-only, and the answer decides what the rest of the role does

- name: Work out whether this host still needs to join
  ansible.builtin.set_fact:
    _tailscale_needs_join: >-
      {{ _tailscale_status.rc | default(1) != 0 or
         (_tailscale_status.stdout | default('', true) | trim | length == 0) or
         ((_tailscale_status.stdout | from_json).BackendState | default('')) != 'Running' }}

- name: Fail fast if joining is needed but no auth key is available
  ansible.builtin.fail:
    msg: >-
      This host isn't on the tailnet and tailscale_authkey is empty. Re-run
      bootstrap.sh and enter an auth key at the prompt (or export
      TAILSCALE_AUTHKEY for that run).
  when: _tailscale_needs_join and not tailscale_authkey

- name: Join tailnet
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey }}
      {{ ('--advertise-tags=' ~ tailscale_tags) if tailscale_tags else '' }}
      --ssh={{ tailscale_ssh | bool | lower }}
      {{ tailscale_args }}
  when: _tailscale_needs_join
  no_log: true   # the command line contains the auth key
  changed_when: true

- name: Read the node's current Tailscale SSH setting
  ansible.builtin.command: tailscale debug prefs
  register: _tailscale_prefs
  changed_when: false
  failed_when: false
  check_mode: false
  when: not _tailscale_needs_join

- name: Make Tailscale SSH match tailscale_ssh
  ansible.builtin.command:
    cmd: "tailscale set --ssh={{ tailscale_ssh | bool | lower }}"
  when:
    - not _tailscale_needs_join
    - _tailscale_prefs.rc | default(1) == 0
    - (_tailscale_prefs.stdout | from_json).RunSSH | default(false) | bool != (tailscale_ssh | bool)
  changed_when: true
