---
# The package repository and the install go through the platform layer (roles/platform: tasks_from repo and package). On apt that is Tailscale's own repository (a key and a
# .list file, each fetched once when missing); on Alpine it is the community repository, which has tailscale.
- name: Add the Tailscale package repository
  ansible.builtin.include_role:
    name: platform
    tasks_from: repo
  vars:
    platform_repo:
      host: pkgs.tailscale.com
      apk:
        community: true
      apt:
        sources_file: /etc/apt/sources.list.d/tailscale.list
        keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
        key_url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        source:
          url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"

- name: Install tailscale
  ansible.builtin.include_role:
    name: platform
    tasks_from: package
  vars:
    platform_package: tailscale
    platform_package_update: true
  # In a check run on a new host the repo files above are only simulated, so the package manager can't see the package.
  when: not ansible_check_mode or not (platform_repo_changed | default(false) | bool)

- name: Is tailscale installed?
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: _tailscale_bin

- name: Nothing more to check until tailscale is really installed
  ansible.builtin.meta: end_role
  when: ansible_check_mode and not _tailscale_bin.stat.exists

- name: Enable + start tailscaled
  ansible.builtin.include_role:
    name: platform
    tasks_from: service
  vars:
    platform_service: tailscale

- name: Host settings Tailscale warns about (forwarding, UDP GRO)
  ansible.builtin.include_tasks: tuning.yml

- name: Check tailnet state
  ansible.builtin.command: tailscale status --json
  register: _tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false   # read-only, and the answer decides what the rest of the role does

- name: Work out whether this host still needs to join
  ansible.builtin.set_fact:
    _tailscale_needs_join: >-
      {{ _tailscale_status.rc | default(1) != 0 or
         (_tailscale_status.stdout | default('', true) | trim | length == 0) or
         ((_tailscale_status.stdout | from_json).BackendState | default('')) != 'Running' }}

- name: Fail fast if joining is needed but no auth key is available
  ansible.builtin.fail:
    msg: >-
      This host isn't on the tailnet and tailscale_authkey is empty. Re-run
      bootstrap.sh and enter an auth key at the prompt (or export
      TAILSCALE_AUTHKEY for that run).
  when: _tailscale_needs_join and not tailscale_authkey

- name: Join tailnet
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey }}
      {{ ('--advertise-tags=' ~ tailscale_tags) if tailscale_tags else '' }}
      --ssh={{ tailscale_ssh | bool | lower }}
      {{ tailscale_args }}
  when: _tailscale_needs_join
  no_log: true   # the command line contains the auth key
  register: _tailscale_join
  failed_when: false   # the reason is reported by the next task, with the key left out
  changed_when: _tailscale_join.rc | default(1) == 0

# no_log hides the whole result, including tailscale's own explanation; show that explanation, minus the key.
- name: Say why joining failed
  ansible.builtin.fail:
    msg: >-
      `tailscale up` failed (exit {{ _tailscale_join.rc }}):
      {{ ((_tailscale_join.stderr | default('')) ~ ' ' ~ (_tailscale_join.stdout | default('')))
         | replace(tailscale_authkey, '<auth key>') | regex_replace('tskey-[A-Za-z0-9_-]+', '<auth key>') | trim }}
      Usual causes: the auth key was already used (a one-off key works once), has expired, was revoked, or was typed or pasted
      with extra characters; a key created for another tailnet; or a tagged key whose tag you may not use. Create a fresh key
      (Tailscale admin console > Settings > Keys, pre-approved) and run bootstrap.sh again with TAILSCALE_AUTHKEY set to it.
  when:
    - _tailscale_needs_join
    - not ansible_check_mode
    - _tailscale_join.rc | default(0) != 0

- name: Read the node's current Tailscale SSH setting
  ansible.builtin.command: tailscale debug prefs
  register: _tailscale_prefs
  changed_when: false
  failed_when: false
  check_mode: false
  when: not _tailscale_needs_join

- name: Make Tailscale SSH match tailscale_ssh
  ansible.builtin.command:
    cmd: "tailscale set --ssh={{ tailscale_ssh | bool | lower }}"
  when:
    - not _tailscale_needs_join
    - _tailscale_prefs.rc | default(1) == 0
    - (_tailscale_prefs.stdout | from_json).RunSSH | default(false) | bool != (tailscale_ssh | bool)
  changed_when: true
