---
- name: Add Tailscale apt repo + install
  block:
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repo
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Enable + start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check tailnet state
  ansible.builtin.command: tailscale status --json
  register: _tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false   # read-only, and the answer decides what the rest of the role does

- name: Work out whether this host still needs to join
  ansible.builtin.set_fact:
    _tailscale_needs_join: >-
      {{ _tailscale_status.rc | default(1) != 0 or
         (_tailscale_status.stdout | default('', true) | trim | length == 0) or
         ((_tailscale_status.stdout | from_json).BackendState | default('')) != 'Running' }}

- name: Fail fast if joining is needed but no auth key is available
  ansible.builtin.fail:
    msg: >-
      This host isn't on the tailnet and tailscale_authkey is empty. Re-run
      bootstrap.sh and enter an auth key at the prompt (or export
      TAILSCALE_AUTHKEY for that run).
  when: _tailscale_needs_join and not tailscale_authkey

- name: Join tailnet
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey }}
      {{ ('--advertise-tags=' ~ tailscale_tags) if tailscale_tags else '' }}
      --ssh={{ tailscale_ssh | bool | lower }}
      {{ tailscale_args }}
  when: _tailscale_needs_join
  no_log: true   # the command line contains the auth key
  changed_when: true

- name: Read the node's current Tailscale SSH setting
  ansible.builtin.command: tailscale debug prefs
  register: _tailscale_prefs
  changed_when: false
  failed_when: false
  check_mode: false
  when: not _tailscale_needs_join

- name: Make Tailscale SSH match tailscale_ssh
  ansible.builtin.command:
    cmd: "tailscale set --ssh={{ tailscale_ssh | bool | lower }}"
  when:
    - not _tailscale_needs_join
    - _tailscale_prefs.rc | default(1) == 0
    - (_tailscale_prefs.stdout | from_json).RunSSH | default(false) | bool != (tailscale_ssh | bool)
  changed_when: true
