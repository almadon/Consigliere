---
# Auth key used only when this host is NOT already on the tailnet (the role
# never re-runs `tailscale up` on a host that's connected). Auth keys are
# short-lived, so they are not stored: bootstrap.sh prompts for it (or reads
# TAILSCALE_AUTHKEY) and it lives only in that one run's environment.
tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') }}"

# Tailscale SSH (tailscaled answering on port 22, governed by tailnet SSH ACLs). Off by
# default: nodes use their own sshd, reached over the tailnet. The role enforces this on
# nodes that already joined, too (it runs `tailscale set --ssh=...` when it differs).
tailscale_ssh: false
# Extra arguments for the first `tailscale up`.
tailscale_args: ""

# Tags to advertise when joining. Empty (the default) advertises none: tag
# names are your own taxonomy, so the framework doesn't pick any. If your
# auth key is tagged, the node gets those tags without this. Set per group in
# config/vars/group/ only if you want the role to advertise tags itself.
tailscale_tags: ""

# ---- Host settings Tailscale itself warns about ("IP forwarding is disabled", "UDP GRO forwarding is
# suboptimally configured") ----------------------------------------------------------------------------
# Forwarding is needed for subnet routing and exit nodes, and Docker turns it on anyway. The host's
# firewall still decides what may be forwarded (ufw's routed policy is deny). Set false to leave it alone.
tailscale_ip_forwarding: true
# Turns UDP GRO forwarding on for the interface that carries the default route (Tailscale's own advice,
# https://tailscale.com/s/ethtool-config-udp-gro), at every boot and when the network comes up.
# Skipped in containers and on NICs that do not support it.
tailscale_udp_gro_tuning: true
