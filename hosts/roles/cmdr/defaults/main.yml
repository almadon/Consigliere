---
# cmdr: the fleet's control page. A small read-only web page (standard-library Python in a stock python image, no build step) that shows every host
# from the fleet repo (what it is, what it provides and runs, its routes), live status read from Loki (is it sending logs, did the last reconcile
# succeed, the exposure scan), and launch buttons for the admin tools. Sign-in is OpenID Connect (documented for Pocket ID).
#
# Secret cmdr.server (config/secrets/cmdr/server.yml), made by scripts/cmdr.sh init:
#   cmdr_oidc_client_id, cmdr_oidc_client_secret, cmdr_session_secret (32+ random characters), cmdr_proxy_secret (optional)
# In the identity provider: a confidential client whose callback URL is  <cmdr_url>/auth/callback, allowed to read the "groups" claim, and groups
# for the people who may use the page (cmdr_admin_groups, cmdr_viewer_groups).
cmdr_dir: /opt/cmdr
cmdr_image: "python:3.13-alpine"
# The public https URL (required: the identity provider sends the browser back to it).
cmdr_url: ""
cmdr_port: 8083
# Publish on this address (the tailnet address by default, as for the other admin tools: Traefik reaches it there), or join cmdr_network instead.
cmdr_bind_address: "{{ tailscale_ipv4 | default('127.0.0.1', true) }}"
cmdr_network: ""
cmdr_oidc_issuer_url: ""
cmdr_admin_groups: [Muximux-Admins]
cmdr_viewer_groups: []
# Sites that may frame the page (the console that embeds it). 'none' = nobody.
cmdr_frame_ancestors: []
# SameSite attribute of the session cookie: Lax (default), Strict or None. None is needed when the page is shown in a frame of another site (a browser extension's
# new-tab page); it is safe for cmdr because cmdr changes nothing on the fleet and its one POST needs a custom header.
cmdr_cookie_samesite: Lax
# Loki, for the live status (the tailnet address of the host that runs it).
cmdr_loki_url: ""
cmdr_status_interval: 60
# VictoriaMetrics, for the host stats (CPU, memory, disk, load: sent by the otel_agent with otel_agent_hostmetrics). Empty = no stats on the page.
cmdr_victoria_url: ""
# What to call the identity provider on the sign-in panel ("Sign in with <name>"). Empty = just "Sign in".
cmdr_idp_name: ""
# Where the fleet repo's config directory is on this host (the reconciler's checkout). Derived from the secrets directory it links.
cmdr_conf_dir: "{{ fleet_secrets_dir | realpath | dirname }}"
# Domains whose routes are only served to the LAN and tailnet (shown with a dashed border).
cmdr_internal_domains: []
# Launch buttons:  - {name: Arkeep, url: "https://ark.ctrl.a64.one", group: Fleet, tailnet: false, desc: "backups"}
cmdr_tools: []
# Per-host buttons; {host} and {host_q} (URL-encoded) are replaced with the host's name:  - {name: Logs, url: "https://gf.ctrl.a64.one/explore?...{host_q}..."}
cmdr_host_links: []
# Copy-to-clipboard command buttons. cmdr never runs anything itself: a button copies the command (with {host} filled in) for you to paste into a
# terminal in the fleet repo checkout. Per host (the first one is the quick button on each host card; the command palette offers every host x command):
cmdr_host_commands:
  - {name: Reconcile now, cmd: "scripts/reconcile-now.sh {host}"}
  - {name: Preview changes, cmd: "scripts/reconcile-now.sh {host} --check"}
  - {name: Containers, cmd: "scripts/fleet-run.sh {host} --yes -- 'docker ps'"}
  - {name: Disk and load, cmd: "scripts/fleet-run.sh {host} --yes -- 'uptime; df -h /'"}
  - {name: Recent errors, cmd: "scripts/fleet-run.sh {host} --yes -- 'journalctl -p err -n 40 --no-pager'"}
# Fleet-wide:
cmdr_commands:
  - {name: Reconcile every host, cmd: "scripts/reconcile-now.sh all"}
  - {name: Preview changes on every host, cmd: "scripts/reconcile-now.sh all --check"}
  - {name: Run the exposure scan now, cmd: "scripts/exposure.sh run"}

# The host cards group a host's tags by KIND, each with its own colour. This explains and styles the kinds (shown in the page's key):
#   label: heading on the card; desc: one line of meaning; color: any CSS colour
cmdr_tag_kinds:
  util: {label: Provides, color: "#dcb053", desc: "A service this host provides to the fleet (its util tags): what the machine is for."}
  feat: {label: Runs, color: "#3fbb7c", desc: "An agent or feature running on this host (its feat tags): how it takes part in the fleet."}
  prop: {label: Settings, color: "#8b9bff", desc: "A property that changes how this host is configured (its prop tags)."}
# Per-tag overrides, keyed by tag name (or kind/name to be exact). Anything left out keeps the kind's colour and the manifest's own description:
#   otel: {label: logs, desc: "Ships its journal and Docker logs to Loki.", color: "#4aa8ff"}
cmdr_tag_overrides: {}

# Who owns an app's settings. A tool in cmdr_tools can say  mgmt: repo | mixed | ui  and shows that badge (explained in the page's key). Names, meanings and colours:
cmdr_mgmt_kinds:
  repo: {label: repo-managed, color: "#8b9bff", desc: "Its settings come from the fleet repo; anything changed in the app itself is put back at the next run."}
  mixed: {label: shared, color: "#dcb053", desc: "The repo sets part of it (tiles, data sources, jobs); the rest is yours and is kept."}
  ui: {label: your settings, color: "#3fbb7c", desc: "Only the deployment is managed. Its settings live inside the app: back them up (Arkeep) rather than expect them in git."}
