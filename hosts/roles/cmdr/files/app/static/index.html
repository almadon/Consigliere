<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>cmdr · fleet console</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="cmdr home"><img src="/static/logo.svg" alt=""><span><span>cmdr</span><span class="cursor" aria-hidden="true"></span><small>fleet console</small></span></a>
  <button class="omni" id="omni" type="button" aria-label="Search and commands"><span>Search hosts, services, commands…</span><kbd class="hide-s">⌘K</kbd></button>
  <div class="spacer"></div>
  <button class="iconbtn" id="refresh" type="button" title="Re-read live status now">↻ <span class="hide-s">Refresh</span></button>
  <button class="iconbtn" id="theme" type="button" title="Theme: auto / dark / light" aria-label="Switch theme">◐</button>
  <div class="user" id="user"></div>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <section class="strip" id="strip" aria-label="Fleet at a glance"></section>
  <section aria-label="Needs attention" id="attention" hidden></section>
  <section aria-label="Launchpad"><div class="bar"><h2>Launchpad</h2></div><div class="pad" id="tools"></div></section>
  <section aria-label="Hosts">
    <div class="bar">
      <h2>Hosts</h2>
      <div class="chips" id="chips"></div>
      <span class="grow"></span>
      <div class="tools-row">
        <input id="q" type="search" placeholder="Filter hosts…  ( / )" autocomplete="off" aria-label="Filter hosts">
        <select id="sort" aria-label="Sort"><option value="status">Needs attention first</option><option value="name">Name</option><option value="type">Type</option></select>
        <div class="seg" role="group" aria-label="Layout"><button type="button" id="v-grid" aria-pressed="true">Cards</button><button type="button" id="v-list" aria-pressed="false">Rows</button></div>
      </div>
    </div>
    <div class="grid" id="hosts"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>
  <section aria-label="Public exposure" id="exposure"></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Host details"></aside>
<div class="scrim" id="pscrim" hidden></div>
<div class="pal" id="pal" role="dialog" aria-label="Command palette" hidden>
  <input id="pin" type="text" placeholder="Type a host, a service, or a command…" autocomplete="off" spellcheck="false" aria-label="Search">
  <ul id="plist" role="listbox"></ul>
  <div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> open / copy</span><span><kbd>esc</kbd> close</span></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<footer class="foot" id="foot"></footer>
<script src="/static/app.js"></script>
</body>
</html>
