---
# Applied to hosts tagged feat:arcane. Deploys the Arcane agent so the central
# Arcane manager can also see/manage this host's Docker. See
# defaults/main.yml for what's expected from your private fleet-config
# repo -- in particular, arcane_agent_token has no automated provisioning
# path (see that file).

- name: Fail fast if the Arcane manager API URL isn't configured
  ansible.builtin.fail:
    msg: >-
      arcane_server_api_url is not set -- it's the util:arcane hosts
      host's address, e.g. http://100.x.x.x:3552, set in your fleet-config
      repo's config/vars/group/ files.
  when: >-
    arcane_server_api_url is not defined or not arcane_server_api_url or
    arcane_server_api_url is search('CHANGEME')

# The token is a per-host secret: config/secrets/arcane/agent-<host>.yml in the fleet repo, readable only by that host (scope
# arcane.agent-<host>, granted with extra_grants in config/access.yml). A token set as the host variable arcane_agent_token still
# works, but it sits in the repo in clear text; the secret wins when both exist.
- name: Look for this host's Arcane agent token secret
  ansible.builtin.stat:
    path: "{{ fleet_secrets_dir | default(playbook_dir ~ '/secrets') }}/arcane/agent-{{ inventory_hostname }}.yml"
  register: _arcane_agent_secret

- name: Load this host's Arcane agent token
  ansible.builtin.include_role:
    name: load_secrets
  vars:
    load_secrets_scopes: ["arcane.agent-{{ inventory_hostname }}"]
  when: _arcane_agent_secret.stat.exists

# util: docker hosts get this role by default, so a host whose token has not been minted
# yet is skipped with a warning instead of failing the whole run.
- name: Skip until this host has an Arcane agent token
  ansible.builtin.debug:
    msg: >-
      Arcane agent skipped on {{ inventory_hostname }}: arcane_agent_token is not set. Mint one in
      the Arcane manager (Environments > add an edge agent) and store it as the secret
      arcane.agent-{{ inventory_hostname }} (see defaults/main.yml). Set arcane_agent_skip: true
      there to silence this.
  when: >-
    not (arcane_agent_skip | default(false)) and
    (arcane_agent_token is not defined or not arcane_agent_token or arcane_agent_token is search('CHANGEME'))

- name: Stop here without a token
  ansible.builtin.meta: end_role
  when: >-
    (arcane_agent_skip | default(false)) or
    arcane_agent_token is not defined or not arcane_agent_token or arcane_agent_token is search('CHANGEME')

- name: Create Arcane agent directory
  ansible.builtin.file:
    path: "{{ arcane_agent_dir }}"
    state: directory
    mode: "0750"

- name: Write Arcane agent compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ arcane_agent_dir }}/docker-compose.yml"
    mode: "0640"
  register: _arcane_agent_compose

- name: Check that no container this role needs is already taken by something else
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [arcane-edge-agent]
    docker_guard_dir: "{{ arcane_agent_dir }}"

- name: Start Arcane agent
  community.docker.docker_compose_v2:
    project_src: "{{ arcane_agent_dir }}"
    state: present
    pull: "{{ 'always' if _arcane_agent_compose.changed else 'missing' }}"
  # In a check run the directory and compose file above are not really written yet.
  when: not ansible_check_mode or not _arcane_agent_compose.changed

# A container that starts and dies again would otherwise go unnoticed: `docker compose up` succeeds, the reconcile reports success, and the
# agent sits in a restart loop (all six agents did for six days after a change of image that renamed their settings). So give a new
# container a few seconds, then fail the run, and so Cmdr's reconcile status, if it is not up.
- name: Give a changed agent a moment to start (or to fall over)
  ansible.builtin.pause:
    seconds: 15
  when: not ansible_check_mode and _arcane_agent_compose.changed

- name: Look at the agent container
  community.docker.docker_container_info:
    name: arcane-edge-agent
  register: _arcane_agent_info
  when: not ansible_check_mode

- name: Fail the run if the agent is not staying up
  ansible.builtin.assert:
    that:
      - _arcane_agent_info.exists
      - _arcane_agent_info.container.State.Running
      - not _arcane_agent_info.container.State.Restarting
      - _arcane_agent_info.container.RestartCount | int < 5
    fail_msg: >-
      The Arcane agent is not staying up (running: {{ _arcane_agent_info.container.State.Running | default('no container') }},
      restarting: {{ _arcane_agent_info.container.State.Restarting | default('n/a') }},
      restarts: {{ _arcane_agent_info.container.RestartCount | default('n/a') }}). See `docker logs arcane-edge-agent` on this host;
      a setting the image no longer reads is the usual cause.
    quiet: true
  when: not ansible_check_mode
