---
# Applied to hosts tagged feat:arcane. Deploys the Arcane agent so the central
# Arcane manager can also see/manage this host's Docker. See
# defaults/main.yml for what's expected from your private fleet-config
# repo -- in particular, arcane_agent_token has no automated provisioning
# path (see that file).

- name: Fail fast if the Arcane manager API URL isn't configured
  ansible.builtin.fail:
    msg: >-
      arcane_server_api_url is not set -- it's the util:arcane hosts
      host's address, e.g. http://100.x.x.x:3552, set in your fleet-config
      repo's config/vars/group/ files.
  when: >-
    arcane_server_api_url is not defined or not arcane_server_api_url or
    arcane_server_api_url is search('CHANGEME')

# util: docker hosts get this role by default, so a host whose token has not been minted
# yet is skipped with a warning instead of failing the whole run.
- name: Skip until this host has an Arcane agent token
  ansible.builtin.debug:
    msg: >-
      Arcane agent skipped on {{ inventory_hostname }}: arcane_agent_token is not set. Mint one in
      the Arcane manager (Environments > add an edge agent) and put it in this host's
      config/vars/host/{{ inventory_hostname }}.yml (see defaults/main.yml). Set arcane_agent_skip: true
      there to silence this.
  when: >-
    not (arcane_agent_skip | default(false)) and
    (arcane_agent_token is not defined or not arcane_agent_token or arcane_agent_token is search('CHANGEME'))

- name: Stop here without a token
  ansible.builtin.meta: end_role
  when: >-
    (arcane_agent_skip | default(false)) or
    arcane_agent_token is not defined or not arcane_agent_token or arcane_agent_token is search('CHANGEME')

- name: Create Arcane agent directory
  ansible.builtin.file:
    path: "{{ arcane_agent_dir }}"
    state: directory
    mode: "0750"

- name: Write Arcane agent compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ arcane_agent_dir }}/docker-compose.yml"
    mode: "0640"
  register: _arcane_agent_compose

- name: Check that no container this role needs is already taken by something else
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [arcane-edge-agent]
    docker_guard_dir: "{{ arcane_agent_dir }}"

- name: Start Arcane agent
  community.docker.docker_compose_v2:
    project_src: "{{ arcane_agent_dir }}"
    state: present
    pull: "{{ 'always' if _arcane_agent_compose.changed else 'missing' }}"
  # In a check run the directory and compose file above are not really written yet.
  when: not ansible_check_mode or not _arcane_agent_compose.changed
