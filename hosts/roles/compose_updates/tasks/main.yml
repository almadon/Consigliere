---
- name: Install the update script
  ansible.builtin.template:
    src: fleet-compose-update.sh.j2
    dest: /usr/local/sbin/fleet-compose-update.sh
    owner: root
    group: root
    mode: "0750"

- name: Schedule the update run
  ansible.builtin.include_role:
    name: platform
    tasks_from: schedule
  vars:
    platform_schedule:
      name: fleet-compose-update
      header: "Managed by Ansible (hosts/roles/compose_updates)"
      description: "docker compose pull and up -d, then notify"
      timer_description: "Scheduled docker compose update"
      command: /usr/local/sbin/fleet-compose-update.sh
      after:
        - docker.service
      calendar: "{{ compose_updates_schedule }}"
      randomized_delay: "{{ compose_updates_randomized_delay }}"
