---
# Runs whatever this host's tags select (see hosts/tags/ and the fleet repo's
# config/tags/): each tag value in the host table (util, feat, ...) has a manifest
# naming roles and task files. Included from site.yml.
- name: Work out what this host runs from its tags
  ansible.builtin.set_fact:
    _fleet_plan_data: "{{ lookup('fleet_roles') }}"
  tags: [always]

# Tags implied by `requires:` (and cert: values) are not in the host table, so their
# groups (and therefore vars/group/feat_certwarden.yml and the like) don't exist yet.
- name: Join the groups of every tag that applies, including implied ones
  ansible.builtin.group_by:
    key: "{{ item | replace('/', '_') | replace('.', '_') }}"
  loop: "{{ _fleet_plan_data.tags | reject('search', '/_default$') | list }}"
  changed_when: false
  tags: [always]

- name: Report the plan
  ansible.builtin.debug:
    msg: >-
      tags with manifests: {{ _fleet_plan_data.tags }};
      tags without one (just classes): {{ _fleet_plan_data.unknown }};
      runs: {{ _fleet_plan_data.plan | map(attribute='tag') | list }}
  tags: [always]

- name: Run the selected roles and task files, in manifest order
  ansible.builtin.include_tasks: run_item.yml
  loop: "{{ _fleet_plan_data.plan }}"
  loop_control:
    loop_var: _fleet_item
    label: "{{ _fleet_item.tag }}: {{ _fleet_item.name | default(_fleet_item.file) }}"

# The firewall comes last, once everything the tags put on this host is known: the tag
# manifests' `firewall:` lists say which ports to open to the world.
# Skipped where the host has no ufw to drive (firewall_manage: false), for example Unraid.
- name: Apply the host firewall
  ansible.builtin.include_role:
    name: firewall
  vars:
    firewall_tag_rules: "{{ _fleet_plan_data.firewall }}"
  when: firewall_manage | default(true) | bool
