---
# Wazuh agent enrollment -- replaces the earlier Lynis + Linux Malware
# Detect approach (see VISION.md: "Security posture / malware detection -
# moving to Wazuh"). Wazuh gives fleet-wide FIM/rootkit/malware detection
# with a real single-pane dashboard instead of two separate CLI tools and
# no aggregation; the manager/indexer/dashboard stack lives in
# stacks/wazuh/, this role is just the agent side.
#
# Same repo and key as Wazuh's documented apt install (https://documentation.wazuh.com,
# Linux agent install), written as a deb822 .sources file with the armored key so nothing
# here depends on gpg/apt-key being present.

- name: Fail fast if no Wazuh server address is configured
  ansible.builtin.fail:
    msg: >-
      wazuh_server_addr is not set -- point it at the util:wazuh hosts
      host's Tailscale address (see stacks/wazuh/README.md) before this
      role can enroll an agent.
  when: >-
    wazuh_server_addr is not defined or not wazuh_server_addr or
    wazuh_server_addr is search('CHANGEME')

- name: Is the Wazuh apt source already set up another way?
  ansible.builtin.include_role:
    name: baseline
    tasks_from: apt_foreign_source
  vars:
    baseline_apt_source_host: packages.wazuh.com
    baseline_apt_our_files: [/etc/apt/sources.list.d/wazuh.sources]
    baseline_apt_our_keyrings: [/etc/apt/keyrings/wazuh.asc]

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Armored key + deb822 .sources, no gpg/apt-key needed on the host.
- name: Download the Wazuh GPG key
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /etc/apt/keyrings/wazuh.asc
    mode: "0644"
  register: _wazuh_agent_key
  when: _baseline_apt_foreign | length == 0

- name: Add the Wazuh apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/wazuh.sources
    content: |
      Types: deb
      URIs: https://packages.wazuh.com/{{ wazuh_agent_apt_repo_version }}/apt/
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/wazuh.asc
    owner: root
    group: root
    mode: "0644"
  register: _wazuh_agent_repo
  notify: Refresh the package index after the Wazuh repo changed
  when: _baseline_apt_foreign | length == 0

- name: Pick up the new repo before installing from it
  ansible.builtin.meta: flush_handlers

- name: Install wazuh-agent
  ansible.builtin.apt:
    name: wazuh-agent
    state: present
    update_cache: true
  # In a check run on a new host the repo files above are only simulated, so apt can't see the package.
  when: not ansible_check_mode or not (_wazuh_agent_key.changed | default(false) or _wazuh_agent_repo.changed | default(false))
  environment:
    WAZUH_MANAGER: "{{ wazuh_server_addr }}"
    # NOTE: WAZUH_MANAGER only templates /var/ossec/etc/ossec.conf on *first*
    # install -- apt's state=present is a no-op on repeat ansible-pull runs
    # once the package exists, so changing wazuh_server_addr later needs an
    # explicit ossec.conf update, not just a re-run of this task. Fine for a
    # single-manager setup; revisit if a second manager ever exists.

- name: Enable + start wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or not (_wazuh_agent_key.changed | default(false) or _wazuh_agent_repo.changed | default(false))
