---
# OpenTelemetry Collector (contrib build; on hosts with apt and systemd installed from the project's .deb and run by systemd as an unprivileged user, elsewhere run as a container, see otel_agent_mode) that ships this
# host's logs to Loki's native OTLP endpoint: the systemd journal, and the logs of every Docker container (json-file driver).
# No secret needed: Loki takes logs only from the tailnet.
otel_agent_version: "0.163.1"
# How the collector runs: native (the .deb under systemd), container (the image under Docker, reading the host through mounts), or auto = native where the host has apt and systemd,
# container everywhere else (Alpine, Unraid, a container reconciler). Switching a host from one to the other is not handled: remove the old one first.
otel_agent_mode: auto
otel_agent_image: otel/opentelemetry-collector-contrib
# Container mode: where the compose file, the configuration and the collector's state (read offsets, the send queue) live on the host.
otel_agent_container_dir: "{{ common_dir | default('/opt/common') }}/otel-agent"
# Loki's OTLP endpoint (a DNS record for the Loki host's tailnet address). Set it in config/vars/group/feat_otel.yml.
otel_agent_loki_url: ""
# The host's name in Loki (label host_name). The fleet's short name by default.
otel_agent_host_name: "{{ inventory_hostname }}"
# Journal entries at this priority or more severe: emerg, alert, crit, err, warning, notice, info, debug.
otel_agent_journal: true
otel_agent_journal_priority: info
# The system log as a file, for a host without a journal (container mode): lines of the file in rfc3164 syslog format. The file comes from the platform profile
# (/var/log/messages on Alpine, /var/log/syslog on Unraid); set otel_agent_system_log_files to read others. The syslog zone is otel_agent_syslog_timezone below.
otel_agent_system_log: true
otel_agent_system_log_files: []
# Docker container logs. "auto" = when Docker is installed on the host.
otel_agent_docker_logs: auto
# Hard limits: the collector's own soft limit (MiB, drops data under pressure instead of growing) and systemd's ceiling.
otel_agent_memory_limit_mib: 128
otel_agent_memory_max: 256M
# Container mode only: "" runs without a memory limit. Left as is, the limit is tried first and dropped on a host whose Docker cannot set one (an LXC without the memory controller).
# Extra resource attributes on everything this host sends, for example {environment: lab}.
otel_agent_attributes: {}
# Where the host is, from the fleet's host table (its site: the provider or place, location: a city label, org), sent as the resource attributes site, location and org so dashboards
# can group and filter by them. In VictoriaMetrics they are labels on every series; in Loki they are structured metadata ({host_name="x"} | site="netcup"). Empty = not sent.
otel_agent_site: "{{ site | default('') }}"
otel_agent_location: "{{ location | default('') }}"
otel_agent_org: "{{ org | default('') }}"

# Syslog listeners: this host also RECEIVES syslog from devices that cannot run the collector (Unraid, UniFi gear, switches) and forwards it to
# Loki, labelled with the sender's own host name (host_name) and program (unit). Empty = none. Each entry:
#   - {name: unraid, listen: "192.0.2.10:1514", transport: tcp, protocol: rfc3164}
#     name: short label for this listener; listen: address:port (an unprivileged port, above 1023); transport: tcp or udp;
#     protocol: rfc3164 (classic BSD syslog, what Unraid and most gear send) or rfc5424.
# Open the port to the senders' network only (firewall_extra_rules on this host). Prefer tcp where the sender supports it: udp drops lines.
otel_agent_syslog_listeners: []
# Syslog timestamps (rfc3164) carry no time zone: the zone the senders use.
otel_agent_syslog_timezone: UTC

# Metrics relay (optional): this collector RECEIVES OTLP/HTTP metrics (JSON or protobuf) from software on this host and forwards them to
# VictoriaMetrics as protobuf, which is all VictoriaMetrics accepts. Used for Proxmox's built-in metric server (Datacenter > Metric Server >
# OpenTelemetry, server 127.0.0.1, port 4318, path /v1/metrics). Both empty = off.
#   otel_agent_metrics_url: VictoriaMetrics' OTLP base, for example http://vm.ctrl.a64.one:8428/opentelemetry
#   otel_agent_otlp_listen: address:port to listen on; keep it on 127.0.0.1 so only this host can send. Empty = no relay (host metrics below can still be sent).
otel_agent_metrics_url: ""
otel_agent_otlp_listen: ""
# This host's own CPU, memory, disk and load, scraped every otel_agent_hostmetrics_interval and sent to otel_agent_metrics_url (cmdr shows them).
# Needs otel_agent_metrics_url. Beszel stays the deep dive; these are the at-a-glance numbers for every host.
otel_agent_hostmetrics: false
otel_agent_hostmetrics_interval: 60s
# Container mode with host metrics: the host's root is mounted read-only here for the collector to read (its root_path). It is the widest thing the container is given;
# leave host metrics off (the default) and nothing but the logs and the state directory is mounted.
otel_agent_hostfs: /hostfs

# Per-container metrics (docker_stats receiver): CPU, memory, network, block I/O, restarts and uptime of every container on this host, sent to
# otel_agent_metrics_url (VictoriaMetrics). Needs Docker and otel_agent_metrics_url. The collector never touches Docker's socket itself: the role runs a
# read-only socket proxy (tecnativa/docker-socket-proxy: containers, events and ping only, no writes) that listens on 127.0.0.1 only.
otel_agent_docker_stats: false
otel_agent_docker_stats_interval: 30s
otel_agent_docker_proxy_version: "v0.5.0"
otel_agent_docker_proxy_port: 2375
# HAProxy's log level in the proxy. At info it logs every request (the collector polls every few seconds, and the collector then ships those lines to Loki too: on a busy host
# the proxy was the largest log source). warning drops the per-request lines and keeps HAProxy's own warnings and errors.
otel_agent_docker_proxy_log_level: warning
otel_agent_docker_proxy_dir: "{{ common_dir | default('/opt/common') }}/otel-docker-proxy"
