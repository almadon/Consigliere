---
# The package starts the collector with its stock configuration on install; on a host where another service already holds the stock
# OTLP ports (Netdata on Proxmox does, 127.0.0.1:4317) that start fails repeatedly and systemd stops retrying ("start request
# repeated too quickly"). Clear that state first so the restart with our configuration is allowed.
- name: Restart otelcol-contrib
  ansible.builtin.command: systemctl reset-failed otelcol-contrib
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  listen: Restart otelcol-contrib

- name: Restart otelcol-contrib (after reset)
  ansible.builtin.systemd:
    name: otelcol-contrib
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
  listen: Restart otelcol-contrib
