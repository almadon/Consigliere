---
# The docker_stats receiver needs Docker's API. Giving the collector the socket would hand it root on the host, so it talks to a read-only proxy instead:
# containers, events and ping only (no POST, no exec, no images), listening on 127.0.0.1 where only this host can reach it.
- name: Create the proxy directory
  ansible.builtin.file:
    path: "{{ otel_agent_docker_proxy_dir }}"
    state: directory
    mode: "0750"

- name: Write the proxy's compose file
  ansible.builtin.template:
    src: docker-proxy-compose.yml.j2
    dest: "{{ otel_agent_docker_proxy_dir }}/docker-compose.yml"
    mode: "0640"
  register: _otel_agent_docker_proxy_compose

- name: Check that the container name is free
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [otel-docker-proxy]
    docker_guard_dir: "{{ otel_agent_docker_proxy_dir }}"

- name: Start the proxy
  community.docker.docker_compose_v2:
    project_src: "{{ otel_agent_docker_proxy_dir }}"
    state: present
    pull: "{{ 'always' if _otel_agent_docker_proxy_compose.changed else 'missing' }}"
  when: not ansible_check_mode or not _otel_agent_docker_proxy_compose.changed
