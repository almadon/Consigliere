---
- name: Check the settings
  ansible.builtin.assert:
    that:
      - otel_agent_loki_url is match('^https?://')
      - otel_agent_journal | bool or _otel_agent_docker_wanted or otel_agent_system_log | bool or otel_agent_syslog_listeners | length > 0 or otel_agent_metrics_url | length > 0
      - otel_agent_metrics_url | length > 0 or (otel_agent_otlp_listen | length == 0 and not otel_agent_hostmetrics | bool and not otel_agent_docker_stats | bool)
      - otel_agent_metrics_url == '' or otel_agent_metrics_url is match('^https?://')
      - otel_agent_memory_limit_mib | int >= 64
      - otel_agent_syslog_listeners | selectattr('transport', 'in', ['tcp', 'udp']) | list | length == otel_agent_syslog_listeners | length
      - otel_agent_syslog_listeners | map(attribute='name') | list | unique | length == otel_agent_syslog_listeners | length
      - otel_agent_syslog_listeners | map(attribute='name') | select('match', '^[a-z0-9_]+$') | list | length == otel_agent_syslog_listeners | length
      - otel_agent_journal_priority in ['emerg', 'alert', 'crit', 'err', 'warning', 'notice', 'info', 'debug']
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
      - otel_agent_mode in ['auto', 'native', 'container']
    fail_msg: >-
      Set otel_agent_loki_url (Loki's OTLP address, for example http://lk.ctrl.a64.one:3100/otlp) in config/vars/group/feat_otel.yml.
      otel_agent_journal_priority is one of emerg, alert, crit, err, warning, notice, info, debug. The collector package exists for
      x86_64 and aarch64 only; at least one of journal and Docker logs must be on; otel_agent_otlp_listen, otel_agent_hostmetrics and otel_agent_docker_stats need otel_agent_metrics_url; the memory limit is at least 64 MiB.
    quiet: true
  vars:
    _otel_agent_docker_wanted: "{{ otel_agent_docker_logs | string | lower in ['auto', 'true', 'yes'] }}"

# native: the project's .deb run by systemd (hosts with apt and systemd). container: the collector image run by Docker, reading the host through mounts (hosts
# without them: Alpine, Unraid, anything a container reconciler runs on). auto picks native where it can.
- name: Decide how the collector runs here
  ansible.builtin.set_fact:
    _otel_agent_mode: >-
      {{ otel_agent_mode if otel_agent_mode != 'auto'
         else ('native' if ('apt' in platform_capabilities and 'systemd' in platform_capabilities) else 'container') }}

- name: Native needs apt and systemd on the host
  ansible.builtin.assert:
    that: "'apt' in platform_capabilities and 'systemd' in platform_capabilities"
    fail_msg: "otel_agent_mode is native, but this platform ({{ platform_family }}, {{ platform_runtime_mode }} run) has no apt and systemd to install and run the .deb: use container (or auto)"
    quiet: true
  when: _otel_agent_mode == 'native'

- name: Decide whether to relay metrics
  ansible.builtin.set_fact:
    _otel_agent_metrics: "{{ otel_agent_metrics_url | length > 0 }}"
    _otel_agent_relay: "{{ otel_agent_metrics_url | length > 0 and otel_agent_otlp_listen | length > 0 }}"

- name: Is Docker installed here?
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _otel_agent_docker_bin

# Inside a container reconciler Docker is there by definition (its CLI is not at /usr/bin/docker).
- name: Decide whether to collect Docker logs
  ansible.builtin.set_fact:
    _otel_agent_docker_present: "{{ _otel_agent_docker_bin.stat.exists or platform_runtime_mode == 'container' }}"
    _otel_agent_docker: >-
      {{ (otel_agent_docker_logs | string | lower == 'auto' and (_otel_agent_docker_bin.stat.exists or platform_runtime_mode == 'container'))
         or otel_agent_docker_logs | string | lower in ['true', 'yes'] }}

- name: Decide whether to collect per-container metrics
  ansible.builtin.set_fact:
    _otel_agent_docker_stats: "{{ otel_agent_docker_stats | bool and (_otel_agent_docker_bin.stat.exists or platform_runtime_mode == 'container') }}"

- name: Run the read-only Docker socket proxy for the container metrics
  ansible.builtin.include_tasks: docker_proxy.yml
  when: _otel_agent_docker_stats | bool

- name: Look up the running and stopped containers
  ansible.builtin.command: docker ps -a --no-trunc --format "{% raw %}{{.ID}} {{.Names}}{% endraw %}"
  register: _otel_agent_ps
  changed_when: false
  check_mode: false
  failed_when: false
  when: _otel_agent_docker | bool

# The collector's own container is left out (container mode): each apply recreates it with a new id, so an entry for it would change the configuration on every run.
- name: Build the container id to name table
  ansible.builtin.set_fact:
    _otel_agent_container_names: >-
      {{ dict((_otel_agent_ps.stdout | default('')).splitlines() | reject('search', ' otel-agent$') | map('split', ' ') | selectattr('1', 'defined')
              | map('map', 'trim') | list) }}

# What the config template reads: the systemd journal only where there is one; on a host without it the system log is a file (the profile says which: /var/log/messages
# on Alpine, /var/log/syslog on Unraid); host metrics read the host through /hostfs when the collector is a container.
- name: Work out the log sources and the host path
  ansible.builtin.set_fact:
    _otel_agent_journal: "{{ otel_agent_journal | bool and _otel_agent_mode == 'native' }}"
    _otel_agent_system_logs: >-
      {{ [] if _otel_agent_mode == 'native' or not (otel_agent_system_log | bool)
         else (otel_agent_system_log_files if otel_agent_system_log_files | length > 0
               else ([platform_defaults.system_log] if platform_defaults.system_log is defined else [])) }}
    _otel_agent_hostfs: "{{ otel_agent_hostfs if (_otel_agent_mode == 'container' and otel_agent_hostmetrics | bool) else '' }}"

- name: Install and run the collector as a systemd service
  ansible.builtin.include_tasks: native.yml
  when: _otel_agent_mode == 'native'

- name: Run the collector as a container
  ansible.builtin.include_tasks: container.yml
  when: _otel_agent_mode == 'container'
