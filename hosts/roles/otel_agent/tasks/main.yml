---
- name: Check the settings
  ansible.builtin.assert:
    that:
      - otel_agent_loki_url is match('^https?://')
      - otel_agent_journal | bool or _otel_agent_docker_wanted or otel_agent_syslog_listeners | length > 0 or otel_agent_metrics_url | length > 0
      - (otel_agent_metrics_url | length > 0) == (otel_agent_otlp_listen | length > 0)
      - otel_agent_metrics_url == '' or otel_agent_metrics_url is match('^https?://')
      - otel_agent_memory_limit_mib | int >= 64
      - otel_agent_syslog_listeners | selectattr('transport', 'in', ['tcp', 'udp']) | list | length == otel_agent_syslog_listeners | length
      - otel_agent_syslog_listeners | map(attribute='name') | list | unique | length == otel_agent_syslog_listeners | length
      - otel_agent_syslog_listeners | map(attribute='name') | select('match', '^[a-z0-9_]+$') | list | length == otel_agent_syslog_listeners | length
      - otel_agent_journal_priority in ['emerg', 'alert', 'crit', 'err', 'warning', 'notice', 'info', 'debug']
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      Set otel_agent_loki_url (Loki's OTLP address, for example http://lk.ctrl.a64.one:3100/otlp) in config/vars/group/feat_otel.yml.
      otel_agent_journal_priority is one of emerg, alert, crit, err, warning, notice, info, debug. The collector package exists for
      x86_64 and aarch64 only; at least one of journal and Docker logs must be on; otel_agent_metrics_url and otel_agent_otlp_listen are set together or not at all; the memory limit is at least 64 MiB.
    quiet: true
  vars:
    _otel_agent_docker_wanted: "{{ otel_agent_docker_logs | string | lower in ['auto', 'true', 'yes'] }}"

- name: Decide whether to relay metrics
  ansible.builtin.set_fact:
    _otel_agent_metrics: "{{ otel_agent_metrics_url | length > 0 }}"

- name: Is Docker installed here?
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _otel_agent_docker_bin

- name: Decide whether to collect Docker logs
  ansible.builtin.set_fact:
    _otel_agent_docker: >-
      {{ (otel_agent_docker_logs | string | lower == 'auto' and _otel_agent_docker_bin.stat.exists)
         or otel_agent_docker_logs | string | lower in ['true', 'yes'] }}

- name: Look up the running and stopped containers
  ansible.builtin.command: docker ps -a --no-trunc --format "{% raw %}{{.ID}} {{.Names}}{% endraw %}"
  register: _otel_agent_ps
  changed_when: false
  check_mode: false
  failed_when: false
  when: _otel_agent_docker | bool

- name: Build the container id to name table
  ansible.builtin.set_fact:
    _otel_agent_container_names: >-
      {{ dict((_otel_agent_ps.stdout | default('')).splitlines() | map('split', ' ') | selectattr('1', 'defined')
              | map('map', 'trim') | list) }}

- name: Which collector version is installed?
  ansible.builtin.command: dpkg-query -W -f='${Version}' otelcol-contrib
  register: _otel_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download the collector package (checksum from the release)
  ansible.builtin.get_url:
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_agent_version }}/otelcol-contrib_{{ otel_agent_version }}_linux_{{ _otel_agent_arch }}.deb"
    dest: "/var/cache/otelcol-contrib_{{ otel_agent_version }}_{{ _otel_agent_arch }}.deb"
    checksum: "sha256:https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_agent_version }}/otelcol-contrib_{{ otel_agent_version }}_linux_{{ _otel_agent_arch }}.deb.sha256"
    mode: "0644"
  vars:
    _otel_agent_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: _otel_agent_installed.stdout != otel_agent_version
  register: _otel_agent_deb

# The package starts the service with its stock config; ours replaces it right after (the restart handler runs below).
- name: Install the collector package
  ansible.builtin.apt:
    deb: "/var/cache/otelcol-contrib_{{ otel_agent_version }}_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.deb"
    state: present
  when:
    - _otel_agent_installed.stdout != otel_agent_version
    - not ansible_check_mode
  notify: Restart otelcol-contrib

- name: Let the collector read the systemd journal
  ansible.builtin.user:
    name: otelcol-contrib
    groups: systemd-journal
    append: true
  when: otel_agent_journal | bool and (not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version)
  notify: Restart otelcol-contrib

- name: Create the collector's state directory (read offsets and the send queue survive restarts)
  ansible.builtin.file:
    path: /var/lib/otelcol-contrib/storage
    state: directory
    owner: otelcol-contrib
    group: otelcol-contrib
    mode: "0750"
  when: not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version

# The collector checks the new file itself (receivers, processors and every OTTL statement) before it replaces the live one, so a
# mistake stops this run with the reason and leaves the working configuration in place.
- name: Write the collector's configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/otelcol-contrib validate --config=%s
  when: not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version
  notify: Restart otelcol-contrib
  register: _otel_agent_config

- name: Hardening and limits for the service
  ansible.builtin.file:
    path: /etc/systemd/system/otelcol-contrib.service.d
    state: directory
    mode: "0755"

- name: Write the service drop-in
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/otelcol-contrib.service.d/consigliere.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart otelcol-contrib
  register: _otel_agent_dropin

- name: Flush handlers so the new configuration is live before the final checks
  ansible.builtin.meta: flush_handlers

- name: Enable and start the collector
  ansible.builtin.systemd:
    name: otelcol-contrib
    enabled: true
    state: started
  when: not ansible_check_mode

# A configuration the collector accepts can still fail when it starts (for example a receiver that cannot open its source). After
# any change, make sure the service stays up and say why when it does not.
- name: Give a changed collector a few seconds, then check it stayed up
  when:
    - not ansible_check_mode
    - _otel_agent_config.changed or _otel_agent_dropin.changed or _otel_agent_deb.changed | default(false)
  block:
    - name: Wait for the collector to settle
      ansible.builtin.wait_for:
        timeout: 8

    - name: Read the service state
      ansible.builtin.systemd:
        name: otelcol-contrib
      register: _otel_agent_state

    - name: Fail with the reason if it is not running steadily
      ansible.builtin.command: journalctl -u otelcol-contrib --no-pager -n 12 -o cat
      register: _otel_agent_why
      changed_when: false
      failed_when: _otel_agent_state.status.ActiveState != 'active' or (_otel_agent_state.status.NRestarts | int) > 0
