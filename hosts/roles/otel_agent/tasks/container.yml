---
# The collector as a container (hosts without apt and systemd: Alpine, Unraid, a container reconciler). Included from main.yml. The configuration and the compose file are
# applied by safe_apply, so a bad one is rolled back and the run fails, as it is for the native service.
- name: Create the collector's directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ otel_agent_container_dir }}"
    - "{{ otel_agent_container_dir }}/storage"

- name: Check that the container name is free
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [otel-agent]
    docker_guard_dir: "{{ otel_agent_container_dir }}"

# The image has to be here before its own `validate` can run on the new configuration.
- name: Pull the collector image
  community.docker.docker_image:
    name: "{{ otel_agent_image }}"
    tag: "{{ otel_agent_version }}"
    source: pull
  register: _otel_agent_image_pull
  when: not ansible_check_mode

# A memory limit is tried, not assumed: it needs the memory controller delegated to Docker's cgroup, and an LXC often has none (runc then fails with "memory.max: no such file"
# and the collector never starts). The collector binary is started once with the limit; if that fails the limit is left out and a note says so. An explicit
# otel_agent_memory_max: "" means no limit and skips the probe.
- name: Try the memory limit on this host
  ansible.builtin.command:
    argv: [docker, run, --rm, --memory, "{{ otel_agent_memory_max | lower }}", --entrypoint, /otelcol-contrib, "{{ otel_agent_image }}:{{ otel_agent_version }}", --version]
  register: _otel_agent_probe_memory
  changed_when: false
  failed_when: false
  when: not ansible_check_mode and otel_agent_memory_max | length > 0

- name: Settle the memory limit
  ansible.builtin.set_fact:
    _otel_agent_memory_limit: "{{ '' if (_otel_agent_probe_memory.rc | default(0)) != 0 else otel_agent_memory_max }}"

- name: Say that the limit was left out
  ansible.builtin.debug:
    msg: "no memory limit: Docker cannot set one here ({{ _otel_agent_probe_memory.stderr | default('') | trim | regex_replace('\\s+', ' ') | truncate(140) }})"
  when: otel_agent_memory_max | length > 0 and _otel_agent_memory_limit == ''

# In an LXC the container's own /proc files (meminfo, stat, loadavg, uptime) are lxcfs views, and a Docker container inside it sees the kernel's instead, with or without the host
# mounted: CPU, memory and load would describe the machine the LXC runs on, not the LXC. The Docker daemon runs inside the LXC and sees the lxcfs view, so when its idea of the
# memory is far below what this container (the reconciler) reads from the kernel, the host's own CPU, memory and load are left out of the collector's metrics (the
# filesystem numbers are still right) and a note says so.
- name: Ask Docker how much memory it thinks the host has
  ansible.builtin.command: docker info --format '{% raw %}{{.MemTotal}}{% endraw %}'
  register: _otel_agent_docker_memtotal
  changed_when: false
  failed_when: false
  when: otel_agent_hostmetrics | bool and not ansible_check_mode

- name: Notice a host whose /proc is virtualized
  ansible.builtin.set_fact:
    _otel_agent_proc_virtual: >-
      {{ (_otel_agent_docker_memtotal.stdout | default('') | trim) is match('^[0-9]+$')
         and (_otel_agent_docker_memtotal.stdout | trim | int) < (ansible_facts.memtotal_mb | default(0) | int) * 1048576 * 0.9 }}

- name: Say that the host's CPU, memory and load are left out
  ansible.builtin.debug:
    msg: >-
      host metrics: this host's /proc is virtualized (an LXC): Docker reports {{ (_otel_agent_docker_memtotal.stdout | trim | int / 1048576) | round | int }} MiB, the kernel
      {{ ansible_facts.memtotal_mb }} MiB. A container would read the machine the LXC runs on, so CPU, memory and load are not collected here; filesystem is.
  when: _otel_agent_proc_virtual | bool

- name: Render the collector's configuration and compose file
  ansible.builtin.set_fact:
    _otel_agent_config_text: "{{ lookup('ansible.builtin.template', 'config.yaml.j2') }}"
    _otel_agent_compose_text: "{{ lookup('ansible.builtin.template', 'otel-agent-compose.yml.j2') }}"

# The configuration is validated by the collector itself. The file safe_apply checks lives in the reconciler's own filesystem, which the host's Docker daemon cannot mount, so it
# goes in by value (an environment variable), not by path. The validator also wants the state directory and the host path (root_path) to exist, so the throwaway container gets
# empty ones.
- name: Apply the configuration and the compose file safely
  ansible.builtin.include_role:
    name: safe_apply
  vars:
    safe_apply_name: otel-agent
    safe_apply_files:
      - {dest: "{{ otel_agent_container_dir }}/docker-compose.yml", content: "{{ _otel_agent_compose_text }}", mode: "0640"}
      - dest: "{{ otel_agent_container_dir }}/config.yaml"
        content: "{{ _otel_agent_config_text }}"
        mode: "0644"
        validate: "sh -c 'docker run --rm --tmpfs /var/lib/otelcol-contrib/storage --tmpfs {{ otel_agent_hostfs }} -e OTEL_CONFIG=\"$(cat %s)\" {{ otel_agent_image }}:{{ otel_agent_version }} validate --config=env:OTEL_CONFIG'"
    safe_apply_restart: {kind: compose, project_src: "{{ otel_agent_container_dir }}", name: otel-agent}
    safe_apply_force: "{{ _otel_agent_image_pull.changed | default(false) }}"
  when: not ansible_check_mode

# safe_apply acts when the files change. A first install whose start failed leaves the files in place, so the next run would see nothing to do and report success with no
# collector running. This makes sure it is up on every run (compose changes nothing when it already is) and fails, with Docker's reason, when it cannot start.
- name: Make sure the collector is running
  community.docker.docker_compose_v2:
    project_src: "{{ otel_agent_container_dir }}"
    project_name: otel-agent
    state: present
    pull: never
  when: not ansible_check_mode
