---
# The collector as a systemd service installed from the project's .deb (hosts with apt and systemd). Included from main.yml.
- name: Which collector version is installed?
  ansible.builtin.command: dpkg-query -W -f='${Version}' otelcol-contrib
  register: _otel_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download the collector package (checksum from the release)
  ansible.builtin.get_url:
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_agent_version }}/otelcol-contrib_{{ otel_agent_version }}_linux_{{ _otel_agent_arch }}.deb"
    dest: "/var/cache/otelcol-contrib_{{ otel_agent_version }}_{{ _otel_agent_arch }}.deb"
    checksum: "sha256:https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_agent_version }}/otelcol-contrib_{{ otel_agent_version }}_linux_{{ _otel_agent_arch }}.deb.sha256"
    mode: "0644"
  vars:
    _otel_agent_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
  when: _otel_agent_installed.stdout != otel_agent_version
  register: _otel_agent_deb

# The package starts the service with its stock config; ours replaces it right after (the restart handler runs below).
- name: Install the collector package
  ansible.builtin.apt:
    deb: "/var/cache/otelcol-contrib_{{ otel_agent_version }}_{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}.deb"
    state: present
  when:
    - _otel_agent_installed.stdout != otel_agent_version
    - not ansible_check_mode
  register: _otel_agent_pkg

- name: Let the collector read the systemd journal
  ansible.builtin.user:
    name: otelcol-contrib
    groups: systemd-journal
    append: true
  when: otel_agent_journal | bool and (not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version)
  register: _otel_agent_user

- name: Create the collector's state directory (read offsets and the send queue survive restarts)
  ansible.builtin.file:
    path: /var/lib/otelcol-contrib/storage
    state: directory
    owner: otelcol-contrib
    group: otelcol-contrib
    mode: "0750"
  when: not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version

# The configuration and the service's limits are written, the collector restarted and checked, by safe_apply: validated by the collector itself first,
# the running files kept as <file>.last-good, and if the collector is not healthy afterwards (not running, restarting by itself, in a start-limit) the old
# files are put back and the run FAILS with the reason (and a notification, when fleet-notify is installed). The same content is not retried every run.
- name: Render the collector's configuration and the service drop-in
  ansible.builtin.set_fact:
    _otel_agent_config_text: "{{ lookup('ansible.builtin.template', 'config.yaml.j2') }}"
    _otel_agent_dropin_text: "{{ lookup('ansible.builtin.template', 'override.conf.j2') }}"
  when: not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version

- name: Hardening and limits for the service
  ansible.builtin.file:
    path: /etc/systemd/system/otelcol-contrib.service.d
    state: directory
    mode: "0755"

- name: Apply the configuration safely
  ansible.builtin.include_role:
    name: safe_apply
  vars:
    safe_apply_name: otelcol-contrib
    safe_apply_files:
      - {dest: /etc/otelcol-contrib/config.yaml, content: "{{ _otel_agent_config_text }}", mode: "0644", validate: "/usr/bin/otelcol-contrib validate --config=%s"}
      - {dest: /etc/systemd/system/otelcol-contrib.service.d/consigliere.conf, content: "{{ _otel_agent_dropin_text }}", mode: "0644"}
    safe_apply_restart: {kind: systemd, name: otelcol-contrib, daemon_reload: true}
    safe_apply_force: "{{ (_otel_agent_pkg.changed | default(false)) or (_otel_agent_user.changed | default(false)) }}"
  when: not ansible_check_mode or _otel_agent_installed.stdout == otel_agent_version

- name: Enable and start the collector
  ansible.builtin.systemd:
    name: otelcol-contrib
    enabled: true
    state: started
  when: not ansible_check_mode
