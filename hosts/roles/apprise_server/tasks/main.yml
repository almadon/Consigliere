---
- name: Check the settings
  ansible.builtin.assert:
    that:
      - apprise_server_memory_limit is match('^[0-9]+[kKmMgG]$')
      - apprise_server_admin_url == '' or apprise_server_admin_url is match('^https://')
      - apprise_server_admin_user | length > 0
    fail_msg: apprise_server_memory_limit looks like 256m, apprise_server_admin_url (when set) is an https URL.
    quiet: true

- name: Load the admin login and the session secret (secret apprise.server)
  ansible.builtin.include_role:
    name: load_secrets
  vars:
    load_secrets_scopes: [apprise.server]

- name: Require real secrets
  ansible.builtin.assert:
    that:
      - apprise_server_admin_password is defined
      - apprise_server_web_secret is defined
      - apprise_server_admin_password | length >= 12
      - apprise_server_web_secret | length >= 32
      - "'CHANGEME' not in apprise_server_admin_password"
    fail_msg: The admin password or the session secret is not set up: run scripts/apprise.sh init in the fleet repo.
    quiet: true
  no_log: true

- name: Create the service directory and the container's writable directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop:
    - {path: "{{ apprise_server_dir }}", owner: "{{ apprise_server_admin_owner }}", group: "{{ apprise_server_admin_group }}"}
    - {path: "{{ apprise_server_dir }}/config", owner: "{{ apprise_server_uid }}", group: "{{ apprise_server_gid }}"}
    - {path: "{{ apprise_server_dir }}/plugin", owner: "{{ apprise_server_uid }}", group: "{{ apprise_server_gid }}"}
    - {path: "{{ apprise_server_dir }}/attach", owner: "{{ apprise_server_uid }}", group: "{{ apprise_server_gid }}"}

- name: Write the compose file (it holds the admin login)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ apprise_server_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true
  register: _apprise_server_compose

- name: Create the shared network
  community.docker.docker_network:
    name: "{{ apprise_server_network }}"
  when: apprise_server_network | length > 0

- name: Check that no container this role needs is already taken by something else
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [apprise]
    docker_guard_dir: "{{ apprise_server_dir }}"

- name: Start Apprise
  community.docker.docker_compose_v2:
    project_src: "{{ apprise_server_dir }}"
    state: present
    pull: "{{ 'always' if _apprise_server_compose.changed else 'missing' }}"
  # In a check run the directory and compose file above are not really written yet.
  when: not ansible_check_mode or not _apprise_server_compose.changed

- name: Wait until Apprise answers
  ansible.builtin.uri:
    url: "http://{{ apprise_server_bind_address }}:{{ apprise_server_port }}/status"
    return_content: true
  register: _apprise_server_status
  until: _apprise_server_status.status == 200
  retries: 12
  delay: 5
  changed_when: false
  when: not ansible_check_mode
