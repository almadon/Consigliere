---
- name: Load the users (secret restic.server)
  ansible.builtin.include_role:
    name: load_secrets
  vars:
    load_secrets_scopes: [restic.server]
  when: not restic_server_no_auth

- name: Require users unless authentication is off
  ansible.builtin.assert:
    that:
      - restic_server_htpasswd is defined
      - restic_server_htpasswd | length > 0
      - "'CHANGEME' not in restic_server_htpasswd"
    fail_msg: >-
      restic_server_htpasswd is empty or still a placeholder. Edit the secret:
      scripts/secrets.sh edit restic.server (htpasswd -nbB <user> '<password>' makes a line).
    quiet: true
  when: not restic_server_no_auth
  no_log: true

- name: Prepare the data disk
  when: restic_server_data_device | length > 0
  block:
    - name: Create the mount point
      ansible.builtin.file:
        path: "{{ restic_server_data_dir }}"
        state: directory
        mode: "0750"

    # Makes a filesystem only on a blank device; it fails (never overwrites) when the
    # device already holds a different filesystem.
    - name: Make a filesystem on the data disk if it has none
      community.general.filesystem:
        dev: "{{ restic_server_data_device }}"
        fstype: "{{ restic_server_data_fstype }}"
        opts: "{{ restic_server_data_mkfs_opts }}"

    - name: Mount the data disk
      ansible.posix.mount:
        path: "{{ restic_server_data_dir }}"
        src: "{{ restic_server_data_device }}"
        fstype: "{{ restic_server_data_fstype }}"
        opts: defaults,nofail
        state: mounted

- name: Create the service and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ restic_server_dir }}", mode: "0750"}
    - {path: "{{ restic_server_data_dir }}", mode: "0750"}

- name: Write the htpasswd file (bcrypt hashes)
  ansible.builtin.copy:
    content: "{{ restic_server_htpasswd }}"
    dest: "{{ restic_server_dir }}/htpasswd"
    owner: root
    group: root
    mode: "0644"   # the directory is 0750, so only root reaches it on the host
  when: not restic_server_no_auth
  no_log: true
  notify: Recreate restic server

- name: Write the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ restic_server_dir }}/docker-compose.yml"
    mode: "0640"
  register: _restic_server_compose

- name: Create the shared proxy network
  community.docker.docker_network:
    name: "{{ restic_server_network }}"
  when: restic_server_network | length > 0

- name: Check that no container this role needs is already taken by something else
  ansible.builtin.include_role:
    name: docker
    tasks_from: guard_containers
  vars:
    docker_guard_containers: [restic-server]
    docker_guard_dir: "{{ restic_server_dir }}"

- name: Start the restic REST server
  community.docker.docker_compose_v2:
    project_src: "{{ restic_server_dir }}"
    state: present
    pull: "{{ 'always' if _restic_server_compose.changed else 'missing' }}"
  # In a check run the directory and compose file above are not really written yet.
  when: not ansible_check_mode or not _restic_server_compose.changed

- name: Let a mirror host pull the data read-only (rsync over SSH)
  when: restic_server_mirror_keys | length > 0
  block:
    - name: Install rsync (it ships rrsync)
      ansible.builtin.apt:
        name: rsync
        state: present

    - name: Authorize the mirror keys for a read-only rrsync of the data dir
      ansible.posix.authorized_key:
        user: root
        key: "{{ item }}"
        key_options: 'restrict,command="/usr/bin/rrsync -ro {{ restic_server_data_dir }}"'
        comment: restic mirror (read-only)
        exclusive: false
      loop: "{{ [restic_server_mirror_keys] | flatten }}"

- name: Withdraw mirror keys that are no longer allowed
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: absent
  loop: "{{ [restic_server_mirror_keys_revoked] | flatten }}"
  when: restic_server_mirror_keys_revoked | length > 0
