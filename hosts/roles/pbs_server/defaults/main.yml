---
# A Proxmox Backup Server (PBS) in Docker (community image ayufan/proxmox-backup-server): a second PBS that PULLS a primary
# PBS's backups, so a copy of the VM backups lives somewhere other than the primary. Run it on a host tagged util: [pbs].
#
#   pbs_server_datastores   [{name: spire}]       datastores to make (created once, never touched after)
#   pbs_server_remotes      [{name, host, auth_id, fingerprint}]   the primary PBS to pull from; the API token's secret is in
#                                                  the secret pbs.server under pbs_server_remote_secrets.<name>
#   pbs_server_sync_jobs    [{id, remote, remote_store, store, schedule}]   pull jobs; nothing is removed here when the
#                                                  primary prunes (remove-vanished is off), so this keeps the older copies
#
# Secrets (config/secrets/pbs/server.yml, scope pbs.server): pbs_server_admin_password, pbs_server_remote_secrets.

pbs_server_dir: /opt/pbs-server
# Pinned (the image's tag follows the PBS release, here PBS 4.2.0). Bump on purpose.
pbs_server_version: "v4.2.0-1"
# The web UI and API: on the Tailscale address only, so it is not reachable from anywhere else.
pbs_server_bind_address: "{{ tailscale_ipv4 | default('127.0.0.1', true) }}"
pbs_server_port: 8007
pbs_server_hostname: "{{ inventory_hostname }}-pbs"
# Where the datastores live on the host (mounted at /backups in the container). A directory per datastore is made below it.
pbs_server_data_dir: /srv/pbs
# Make pbs_server_data_dir here. Turn off where the path is created some other way (for example the reconciler runs in a container).
pbs_server_manage_data_dir: true

pbs_server_datastores: []
pbs_server_remotes: []
pbs_server_sync_jobs: []

# Garbage collection (frees chunks no snapshot uses any more) and how much to keep; applied to every datastore made here.
pbs_server_gc_schedule: "sat 03:30"
# The copy here is a last resort, so it keeps more than the primary typically does. Set a key to 0 to leave it out; null for no prune job at all.
pbs_server_prune:
  keep_last: 3
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  keep_yearly: 1
pbs_server_prune_schedule: "sat 02:30"
