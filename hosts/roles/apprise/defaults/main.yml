---
# Notifications for the other roles (apt_updates, compose_updates, ...) through
# Apprise (https://github.com/caronc/apprise): one command, ~100 services (ntfy,
# Telegram, Matrix, email, ...). The service URLs contain tokens, so they come from
# the secret apprise.notify (config/secrets/apprise/notify.yml):
#   apprise_notify_urls:
#     - ntfys://ntfy.example.com/alerts
#     - tgram://<bot token>/<chat id>
# Tags route by urgency: write an entry as a mapping to attach one (fleet-notify uses FLEET_NOTIFY_TAG, default "alert"):
#   apprise_notify_urls:
#     - "pover://<user key>@<app token>?priority=high":
#         - tag: alert
#     - "pover://<user key>@<app token>?priority=low":
#         - tag: info
# Installs /usr/local/bin/fleet-notify "<title>" ["<body>"] (body from stdin if omitted).
apprise_version: "2.0.1"
apprise_venv: /opt/apprise-venv
apprise_config_dir: /etc/apprise
apprise_notify_urls: []
# Prepended to every title so you can tell hosts apart.
apprise_title_prefix: "{{ inventory_hostname }}"

# Central mode: send through the fleet's Apprise API (role apprise_server) instead of holding channel tokens on this host. Set the notify
# endpoint (https://notify.a64.one); the saved-configuration key is in the secret apprise.notify as apprise_endpoint_key (a long random value).
# The tag (alert, info, ...) is still FLEET_NOTIFY_TAG. With an endpoint set, apprise_notify_urls and the Apprise install are not used.
apprise_endpoint: ""
