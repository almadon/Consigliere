---
- name: Install the update script
  ansible.builtin.template:
    src: fleet-apt-update.sh.j2
    dest: /usr/local/sbin/fleet-apt-update.sh
    owner: root
    group: root
    mode: "0750"

- name: Schedule the update run
  ansible.builtin.include_role:
    name: platform
    tasks_from: schedule
  vars:
    platform_schedule:
      name: fleet-apt-update
      header: "Managed by Ansible (hosts/roles/apt_updates)"
      description: "apt update and upgrade, then notify"
      timer_description: "Scheduled apt update and upgrade"
      command: /usr/local/sbin/fleet-apt-update.sh
      calendar: "{{ apt_updates_schedule }}"
      randomized_delay: "{{ apt_updates_randomized_delay }}"
