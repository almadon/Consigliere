---
# deb822 .sources file + an armored key, written with plain file modules: no gpg or
# apt-key needed on the host (Debian 13 has neither by default), and it is the layout
# Docker's own instructions use, so a host that already follows them stays unchanged.
- name: Is the Docker apt source already set up another way?
  ansible.builtin.include_role:
    name: baseline
    tasks_from: apt_foreign_source
  vars:
    baseline_apt_source_host: download.docker.com
    baseline_apt_our_files: [/etc/apt/sources.list.d/docker.sources]
    baseline_apt_our_keyrings: [/etc/apt/keyrings/docker.asc]

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Fetched once, when it is missing. get_url on an old existing file would report "changed" in every check pass (it cannot
# download then, so it assumes the server copy is newer), which makes drift reports noisy. To rotate the key, delete the file.
- name: Is the Docker GPG key already there?
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: _docker_key_file

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: _docker_key
  when:
    - _baseline_apt_foreign | length == 0
    - not _docker_key_file.stat.exists

- name: Add Docker apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      Signed-By: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: _docker_repo
  notify: Refresh the package index after the Docker repo changed
  when: _baseline_apt_foreign | length == 0

- name: Pick up the new repo before installing from it
  ansible.builtin.meta: flush_handlers

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  # In a check run on a new host the repo files above are only simulated, so apt can't see the packages.
  when: not ansible_check_mode or not (_docker_key.changed | default(false) or _docker_repo.changed | default(false))

- name: Is Docker installed?
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _docker_bin

- name: Nothing more to check until Docker is really installed
  ansible.builtin.meta: end_role
  when: ansible_check_mode and not _docker_bin.stat.exists

# Services publish ports on the host's Tailscale IP (see the server_* roles).
# Docker can't bind an address that doesn't exist yet, so after a reboot it must
# start after tailscaled has brought the interface up.
- name: Create the docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Order docker after tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-after-tailscale.conf
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
    mode: "0644"
  notify: Reload systemd for docker

- name: Enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Configure swarm mode
  ansible.builtin.include_tasks: swarm.yml
  when: docker_mode == 'swarm'
