---
# The package repository and the install go through the platform layer (roles/platform: tasks_from repo and package). On apt that is Docker's own repository, a deb822 .sources
# file plus an armored key written with plain file modules (the layout Docker's instructions use, so a host that already follows them stays unchanged); on Alpine it is the
# community repository, which has docker.
- name: Add the Docker package repository
  ansible.builtin.include_role:
    name: platform
    tasks_from: repo
  vars:
    platform_repo:
      host: download.docker.com
      apk:
        community: true
      apt:
        sources_file: /etc/apt/sources.list.d/docker.sources
        keyring: /etc/apt/keyrings/docker.asc
        keyring_dir: /etc/apt/keyrings
        key_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        source:
          content: |
            Types: deb
            URIs: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
            Suites: {{ ansible_facts['distribution_release'] }}
            Components: stable
            Architectures: {{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
            Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker
  ansible.builtin.include_role:
    name: platform
    tasks_from: package
  vars:
    platform_package: docker
  # In a check run on a new host the repo files above are only simulated, so the package manager can't see the packages.
  when: not ansible_check_mode or not (platform_repo_changed | default(false) | bool)

- name: Is Docker installed?
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _docker_bin

- name: Nothing more to check until Docker is really installed
  ansible.builtin.meta: end_role
  when: ansible_check_mode and not _docker_bin.stat.exists

# Services publish ports on the host's Tailscale IP (see the server_* roles).
# Docker can't bind an address that doesn't exist yet, so after a reboot it must
# start after tailscaled has brought the interface up.
- name: Create the docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  when: "'systemd' in platform_capabilities"

- name: Order docker after tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-after-tailscale.conf
    content: |
      # Managed by Ansible (hosts/roles/docker) -- edits here get overwritten on the next reconciliation run.
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
    mode: "0644"
  notify: Reload systemd for docker
  when: "'systemd' in platform_capabilities"

# The same ordering on OpenRC: start docker after tailscale, and ask for it to be started.
- name: Order docker after tailscale (OpenRC)
  ansible.builtin.lineinfile:
    path: /etc/conf.d/docker
    regexp: '^#?{{ item }}='
    line: '{{ item }}="tailscale"'
    create: true
    mode: "0644"
  loop: [rc_after, rc_want]
  when: "'openrc' in platform_capabilities"

- name: Enable + start docker
  ansible.builtin.include_role:
    name: platform
    tasks_from: service
  vars:
    platform_service: docker

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Configure swarm mode
  ansible.builtin.include_tasks: swarm.yml
  when: docker_mode == 'swarm'
